<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUB Flow Desk</title>
<meta name="description" content="KUB market microstructure, candles, execution cost, five-DEX quotes and treasury balances.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f8f8f6; --card:#ffffff; --card-2:#f8f8f6;
  --ink:#1b1c1b; --ink-2:#464746; --ink-3:#6b6b6a;
  --line:#f1f2ef; --line-2:#e6e7e3;
  --accent:#00b359; --accent-ink:#00994d;
  --up:#00994d; --down:#d03b3b; --neutral:#6b6b6a;
  --info:#2a78d6; --warn:#b26a00;
  --r-xs:6px; --r-sm:8px; --r-md:16px; --r-lg:24px;
  --sh1:rgba(27,28,27,.08) 0 2px 5px 0; --sh2:rgba(27,28,27,.08) 0 4px 5px 0;
  --fast:150ms; --slow:200ms;
  --sans:"GraphikTH","Anuphan","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f0e; --card:#191b19; --card-2:#202220;
  --ink:#f6f6f4; --ink-2:#c4c5c1; --ink-3:#8f918d;
  --line:#262826; --line-2:#303230;
  --accent:#00c964; --accent-ink:#17c46e;
  --up:#17c46e; --down:#e06464; --neutral:#8f918d;
  --info:#3987e5; --warn:#d99a1f;
  --sh1:rgba(0,0,0,.4) 0 2px 5px 0; --sh2:rgba(0,0,0,.45) 0 4px 5px 0;
}}
:root[data-theme="dark"]{
  --bg:#0e0f0e; --card:#191b19; --card-2:#202220;
  --ink:#f6f6f4; --ink-2:#c4c5c1; --ink-3:#8f918d;
  --line:#262826; --line-2:#303230;
  --accent:#00c964; --accent-ink:#17c46e;
  --up:#17c46e; --down:#e06464; --neutral:#8f918d;
  --info:#3987e5; --warn:#d99a1f;
  --sh1:rgba(0,0,0,.4) 0 2px 5px 0; --sh2:rgba(0,0,0,.45) 0 4px 5px 0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:22px;font-weight:400;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:16px;padding-right:16px}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:var(--r-xs)}

.mast{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.dot{width:22px;height:22px;border-radius:var(--r-xs);background:var(--accent);flex:none}
.mast h1{margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.mast .pair{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:2px 8px;border:1px solid var(--line-2);border-radius:999px}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:2px;gap:2px;box-shadow:var(--sh1)}
.seg button{font:500 12px/18px var(--sans);padding:5px 10px;background:transparent;color:var(--ink-2);border:0;border-radius:var(--r-xs);cursor:pointer;transition:background var(--fast),color var(--fast)}
.seg button:hover:not(:disabled){background:var(--card-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:disabled{color:var(--ink-3);opacity:.45;cursor:not-allowed}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

.srcline{font-size:12px;color:var(--ink-3);padding-bottom:16px}
.banner{background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--warn);
  border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--ink-2);margin-bottom:16px;box-shadow:var(--sh1)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh1)}
.kpi dt{margin:0;font-size:12px;color:var(--ink-3);font-weight:500}
.kpi dd{margin:6px 0 0;font-family:var(--mono);font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.kpi .sub{font-size:12px;color:var(--ink-3);margin-top:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 18px 14px;margin-bottom:16px;box-shadow:var(--sh1)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:6px}
.ch h2{margin:0;font-size:16px;line-height:24px;font-weight:600}
.ch .when{font-size:12px;color:var(--ink-3);margin-left:auto}
.lede{margin:0 0 14px;font-size:13px;line-height:21px;color:var(--ink-2);max-width:66ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:20px;height:3px;border-radius:2px;flex:none}
.sw.dot{width:10px;height:10px;border-radius:50%}
.sw.hollow{width:10px;height:10px;border-radius:2px;background:transparent;border:2px solid var(--up)}
.sw.solid{width:10px;height:10px;border-radius:2px;background:var(--down)}

svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line-2);stroke-width:1}
.ax{stroke:var(--line-2);stroke-width:1}
.tick{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.dlab{font-family:var(--mono);font-size:11px;font-weight:600}
.hit{fill:transparent;cursor:crosshair}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);padding:0 12px 8px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
tr:last-child td{border-bottom:0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap;color:var(--ink-2)}
.chip.up{color:var(--up);border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.chip.down{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,transparent)}
.chip.mid{color:var(--ink-3)}
.chip.na{color:var(--ink-3);opacity:.7}
.best{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--r-xs)}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:var(--r-xs);background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.note{font-size:12.5px;line-height:20px;color:var(--ink-2);margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.note b{font-weight:600;color:var(--ink)}
.caps{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.empty{font-size:13px;color:var(--ink-3);padding:26px 0;text-align:center}

#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity var(--fast);
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;
  font-family:var(--mono);font-size:11.5px;line-height:17px;color:var(--ink);box-shadow:var(--sh2);max-width:250px}
#tip .k{color:var(--ink-3)}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line-2);font-size:12.5px;line-height:20px;color:var(--ink-2)}
footer p{margin:0 0 8px;max-width:74ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1 data-i18n="title">KUB Flow Desk</h1></div>
    <span class="pair">KUB_THB · Bitkub</span>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-th" data-lang="th">ไทย</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-zh" data-lang="zh">中文</button>
      </div>
      <span class="stamp" id="stamp"></span>
    </div>
  </header>
  <div class="srcline" data-i18n="src"></div>
  <div class="banner" id="banner" hidden></div>
  <dl class="kpis" id="kpis"></dl>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_chart"></h2>
      <div class="seg" id="tfseg" role="group" aria-label="Timeframe"></div>
    </div>
    <ul class="legend">
      <li><span class="sw hollow"></span><span data-i18n="lg_up"></span></li>
      <li><span class="sw solid"></span><span data-i18n="lg_down"></span></li>
    </ul>
    <div id="c-candle"></div>
    <div class="caps" style="margin-top:10px" data-i18n="c_vol"></div>
    <div id="c-cvol"></div>
    <p class="note" id="tfnote"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_tech"></h2><span class="when" id="techwhen"></span></div>
    <p class="lede" data-i18n="l_tech"></p>
    <div class="tw"><table id="t-tech"></table></div>
    <p class="note" data-i18n="n_tech"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_cost"></h2><span class="when" data-i18n="w_now"></span></div>
    <p class="lede" data-i18n="l_cost"></p>
    <ul class="legend">
      <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell"></span></li>
      <li><span class="sw" style="background:var(--info)"></span><span data-i18n="lg_buy"></span></li>
    </ul>
    <div id="c-slip"></div>
    <p class="note" id="slipnote"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_dex"></h2><span class="when">KKUB → KUSDT</span></div>
    <p class="lede" data-i18n="l_dex"></p>
    <div class="tw"><table id="t-dex"></table></div>
    <p class="note" data-i18n="n_dex"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_slipt"></h2><span class="when" data-i18n="w_hourly"></span></div>
    <p class="lede" data-i18n="l_slipt"></p>
    <ul class="legend">
      <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell10"></span></li>
      <li><span class="sw" style="background:var(--info)"></span><span data-i18n="lg_buy10"></span></li>
    </ul>
    <div id="c-slipt"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_taker"></h2><span class="when" data-i18n="w_exec"></span></div>
    <p class="lede" data-i18n="l_taker"></p>
    <ul class="legend">
      <li><span class="sw dot" style="background:var(--info)"></span><span data-i18n="lg_bcross"></span></li>
      <li><span class="sw dot" style="background:var(--down)"></span><span data-i18n="lg_scross"></span></li>
    </ul>
    <div id="c-taker"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_sweep"></h2><span class="when" data-i18n="w_sweep"></span></div>
    <p class="lede" data-i18n="l_sweep"></p>
    <div id="c-sweep"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_treas"></h2><span class="when" data-i18n="w_treas"></span></div>
    <p class="lede" data-i18n="l_treas"></p>
    <div id="c-treas"></div>
    <div class="tw" style="margin-top:14px"><table id="t-treas"></table></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_health"></h2><span class="when" data-i18n="w_log"></span></div>
    <p class="lede" data-i18n="l_health"></p>
    <div class="tw"><table id="t-health"></table></div>
  </section>

  <footer>
    <p data-i18n="f1"></p>
    <p data-i18n="f2"></p>
    <p style="color:var(--ink-3);margin-top:10px" data-i18n="f3"></p>
  </footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script>

/* ---------------- indicators ---------------- */
const SMA=(a,n)=>a.length<n?null:a.slice(-n).reduce((s,v)=>s+v,0)/n;
function EMAseries(a,n){if(a.length<n)return[];const k=2/(n+1);let e=a.slice(0,n).reduce((s,v)=>s+v,0)/n;const out=[e];
  for(let i=n;i<a.length;i++){e=a[i]*k+e*(1-k);out.push(e)}return out}
const EMA=(a,n)=>{const s=EMAseries(a,n);return s.length?s[s.length-1]:null};
function RSI(c,n=14){if(c.length<n+1)return null;let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+(d>0?d:0))/n;l=(l*(n-1)+(d<0?-d:0))/n}
  if(l===0)return 100;return 100-100/(1+g/l)}
function MACD(c,f=12,s=26,sig=9){if(c.length<s+sig)return null;
  const ef=EMAseries(c,f),es=EMAseries(c,s);const off=ef.length-es.length;
  const line=es.map((v,i)=>ef[i+off]-v);if(line.length<sig)return null;
  const sg=EMAseries(line,sig);const L1=line[line.length-1],S1=sg[sg.length-1];
  return{line:L1,signal:S1,hist:L1-S1}}
function STOCH(h,l,c,n=14,d=3){if(c.length<n+d)return null;const ks=[];
  for(let i=n-1;i<c.length;i++){const hh=Math.max(...h.slice(i-n+1,i+1)),ll=Math.min(...l.slice(i-n+1,i+1));
    ks.push(hh===ll?50:(c[i]-ll)/(hh-ll)*100)}
  return{k:ks[ks.length-1],d:SMA(ks,d)}}
function CCI(h,l,c,n=20){if(c.length<n)return null;const tp=c.map((v,i)=>(h[i]+l[i]+v)/3);
  const m=SMA(tp,n),w=tp.slice(-n);const md=w.reduce((s,v)=>s+Math.abs(v-m),0)/n;
  return md===0?0:(tp[tp.length-1]-m)/(.015*md)}
function WILLR(h,l,c,n=14){if(c.length<n)return null;
  const hh=Math.max(...h.slice(-n)),ll=Math.min(...l.slice(-n));
  return hh===ll?-50:(hh-c[c.length-1])/(hh-ll)*-100}
function ATR(h,l,c,n=14){if(c.length<n+1)return null;const tr=[];
  for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  let a=tr.slice(0,n).reduce((s,v)=>s+v,0)/n;
  for(let i=n;i<tr.length;i++)a=(a*(n-1)+tr[i])/n;return a}
function BB(c,n=20,k=2){if(c.length<n)return null;const m=SMA(c,n),w=c.slice(-n);
  const sd=Math.sqrt(w.reduce((s,v)=>s+(v-m)*(v-m),0)/n);return{mid:m,up:m+k*sd,low:m-k*sd}}

  const x=i=>Lx+(i+.5)*(W-Lx-R)/cs.length, y=v=>Tp+(top-v)/(top-bot)*(H-Tp-B);
  const bw=Math.max(2,Math.min(13,(W-Lx-R)/cs.length-2));

    el("text",{class:"tick",x:W-R+8,y:y(v)+3.5},s).textContent="฿"+v.toFixed(2)}
  const last=cs[cs.length-1];
  el("line",{x1:Lx,x2:W-R,y1:y(last[4]),y2:y(last[4]),stroke:"var(--ink-3)","stroke-width":1,"stroke-dasharray":"3 3"},s);

  el("text",{class:"dlab",x:W-R+8,y:y(last[4])+4,fill:"#fff"},s).textContent=last[4].toFixed(2);

    const yo=y(Math.max(c[1],c[4])),yc=y(Math.min(c[1],c[4])),h=Math.max(1.4,yc-yo);
    el("rect",{x:X-bw/2,y:yo,width:bw,height:h,rx:1,
      fill:up?"var(--card)":col,stroke:col,"stroke-width":1.4},s);
    hov(el("rect",{x:X-(W-Lx-R)/cs.length/2,y:Tp,width:(W-Lx-R)/cs.length,height:H-Tp-B,class:"hit"},s),
      `<b>${bkk(c[0])}</b><br><span class="k">O</span> ${c[1].toFixed(2)} <span class="k">H</span> ${c[2].toFixed(2)}<br>
       <span class="k">L</span> ${c[3].toFixed(2)} <span class="k">C</span> ${c[4].toFixed(2)}<br>
       <span class="k">vol</span> ${fmt(c[5])} KUB · ${c[6]} ${T("k_trades")}`)});
  [0,Math.floor(cs.length/2),cs.length-1].forEach((i,k)=>
    el("text",{class:"tick",x:x(i),y:H-B+16,"text-anchor":k===0?"start":k===2?"end":"middle"},s)
      .textContent=bkk(cs[i][0]));
  const vh=Math.max(...cs.map(c=>c[5]))||1;
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:92,y2:92},sv);
  el("text",{class:"tick",x:W-R+8,y:26},sv).textContent=fmt(vh);
  cs.forEach((c,i)=>{const up=c[4]>=c[1],hgt=Math.max(1,(c[5]/vh)*76);
    el("rect",{x:x(i)-bw/2,y:92-hgt,width:bw,height:hgt,rx:1,
      fill:up?"var(--up)":"var(--down)","fill-opacity":up?.5:.55},sv)});
  $("#tfnote").textContent=tpl("tf_note",{bars:CBARS||cs.length,tf:TF});
}

/* ---------------- render: indicators ---------------- */
function tech(){
  const c=CANDLES.map(r=>r[4]),h=CANDLES.map(r=>r[2]),l=CANDLES.map(r=>r[3]),N=c.length;
  const px=c[N-1];
  const chip=(cls,txt)=>`<span class="chip ${cls}">${txt}</span>`;
  const na=`<td class="n">—</td><td>${chip("na",T("p_na"))}</td>`;
  const rows=[];
  const rsi=RSI(c);
  rows.push(["RSI (14)",rsi==null?null:rsi.toFixed(1),rsi==null?null:
    rsi>70?["up",tpl("p_over",{n:70})]:rsi<30?["down",tpl("p_under",{n:30})]:["mid",tpl("p_between",{a:30,b:70})],15]);
  const m=MACD(c);
  rows.push(["MACD (12,26,9)",m==null?null:m.line.toFixed(4),m==null?null:
    (m.hist>=0?["up",T("p_above_sig")]:["down",T("p_below_sig")]),35]);
  const st=STOCH(h,l,c);
  rows.push(["Stochastic %K (14,3)",st==null?null:st.k.toFixed(1),st==null?null:
    st.k>80?["up",tpl("p_over",{n:80})]:st.k<20?["down",tpl("p_under",{n:20})]:["mid",tpl("p_between",{a:20,b:80})],17]);
  const cci=CCI(h,l,c);
  rows.push(["CCI (20)",cci==null?null:cci.toFixed(1),cci==null?null:
    cci>100?["up",tpl("p_over",{n:100})]:cci<-100?["down",tpl("p_under",{n:-100})]:["mid",tpl("p_between",{a:-100,b:100})],20]);
  const wr=WILLR(h,l,c);
  rows.push(["Williams %R (14)",wr==null?null:wr.toFixed(1),wr==null?null:
    wr>-20?["up",tpl("p_over",{n:-20})]:wr<-80?["down",tpl("p_under",{n:-80})]:["mid",tpl("p_between",{a:-80,b:-20})],14]);
  const atr=ATR(h,l,c);
  rows.push(["ATR (14)",atr==null?null:"฿"+atr.toFixed(4),atr==null?null:["mid",T("p_value")],15]);
  const bb=BB(c);
  rows.push(["Bollinger (20, 2σ)",bb==null?null:"฿"+bb.up.toFixed(2)+" / ฿"+bb.low.toFixed(2),bb==null?null:
    px>bb.up?["up",T("p_above_band")]:px<bb.low?["down",T("p_below_band")]:["mid",T("p_in_band")],20]);
  [["SMA",SMA],["EMA",(a,n)=>EMA(a,n)]].forEach(([nm,fn])=>{
    [10,20,50].forEach(n=>{const v=fn(c,n);
      rows.push([`${nm} (${n})`,v==null?null:"฿"+v.toFixed(3),v==null?null:
        (px>v?["up",T("p_px_above")]:["down",T("p_px_below")]),n])});
  });
  let html=`<thead><tr><th>${T("th_ind")}</th><th class="n">${T("th_val")}</th><th>${T("th_pos")}</th><th class="n">${T("th_bars")}</th></tr></thead><tbody>`;
  rows.forEach(([nm,val,pos,need])=>{
    html+=`<tr><td>${nm}</td>`+(val==null?na:`<td class="n">${val}</td><td>${chip(pos[0],pos[1])}</td>`)
      +`<td class="n" style="color:var(--ink-3)">${N} / ${need}</td></tr>`});
  $("#t-tech").innerHTML=html+"</tbody>";
}

/* ---------------- render: other panels ---------------- */
function hourly(){
  if(!LIVE)return[];
  return (D.hourly||[]).map(r=>[bkk(r.hour),r.px_close==null?null:+r.px_close,r.trade_kub==null?null:+r.trade_kub,
    r.taker_buy_pct==null?null:+r.taker_buy_pct,r.slip_sell_10k==null?null:+r.slip_sell_10k,
    r.slip_buy_10k==null?null:+r.slip_buy_10k])}
function cSlip(){
  const W=880,H=290,Lx=54,R=108,Tp=14,B=42,s=mk("#c-slip",W,H);if(!s)return;
  const all=(D.slipNow||[]).map(r=>({side:r.side,size:+r.size_kub,slip:+r.slippage_pct,vwap:+r.vwap,lv:+r.levels_used}));
  const sizes=[...new Set(all.map(r=>r.size))].sort((a,b)=>a-b);if(!sizes.length)return;
  const maxY=Math.max(.5,Math.ceil(Math.max(...all.map(r=>r.slip))*4)/4);
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sizes.length-1),y=v=>H-B-(v/maxY)*(H-B-Tp);
  for(let g=0;g<=maxY+1e-9;g+=maxY/4){el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g.toFixed(2)+"%"}
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  sizes.forEach((sz,i)=>el("text",{class:"tick",x:x(i),y:H-B+18,"text-anchor":"middle"},s)
    .textContent=sz>=1000?sz/1000+"k":sz);
  el("text",{class:"tick",x:(Lx+W-R)/2,y:H-B+34,"text-anchor":"middle"},s).textContent="KUB";
  [["SELL","var(--down)",T("lg_sell")],["BUY","var(--info)",T("lg_buy")]].forEach(([side,col,nm])=>{
    const rs=sizes.map(sz=>all.find(r=>r.side===side&&r.size===sz)).filter(Boolean);if(!rs.length)return;
    const pts=rs.map(r=>[x(sizes.indexOf(r.size)),y(r.slip)]);
    el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L "),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"},s);
    rs.forEach((r,i)=>{el("circle",{cx:pts[i][0],cy:pts[i][1],r:5,fill:col,stroke:"var(--card)","stroke-width":2},s);
      hov(el("circle",{cx:pts[i][0],cy:pts[i][1],r:15,class:"hit"},s),
        `<b>${nm} ${fmt(r.size)} KUB</b><br><span class="k">cost</span> ${r.slip.toFixed(2)}%<br><span class="k">avg</span> ฿${r.vwap.toFixed(4)}<br><span class="k">levels</span> ${r.lv}`)});
    const p=pts[pts.length-1];
    el("text",{class:"dlab",x:p[0]+11,y:p[1]+4,fill:col},s).textContent=`${nm} · ${rs[rs.length-1].slip.toFixed(2)}%`});
  const a=all.find(r=>r.side==="SELL"&&r.size===10000),b=all.find(r=>r.side==="BUY"&&r.size===10000);
  $("#slipnote").innerHTML=a&&b?`<b>10,000 KUB</b> — ${T("lg_sell")}: ${a.slip.toFixed(2)}% · ${T("lg_buy")}: ${b.slip.toFixed(2)}%`:"";
}
function cSlipT(){
  const W=880,H=210,Lx=50,R=14,Tp=12,B=32,s=mk("#c-slipt",W,H);if(!s)return;
  const rs=hourly().map((r,i)=>({i,t:r[0],a:r[4],b:r[5]})),has=rs.filter(r=>r.a!=null||r.b!=null);
  if(!has.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const hi=Math.max(.5,...has.flatMap(r=>[r.a||0,r.b||0]))*1.2;
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,rs.length-1),y=v=>H-B-(v/hi)*(H-B-Tp);
  [0,hi/2,hi].forEach(g=>{el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-8,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g.toFixed(2)+"%"});
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  [["a","var(--down)"],["b","var(--info)"]].forEach(([k,col])=>{let d="",open=false;
    rs.forEach(r=>{if(r[k]==null){open=false;return}d+=(open?" L ":" M ")+x(r.i)+" "+y(r[k]);open=true});
    if(d)el("path",{d:d.trim(),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"},s)});
  rs.forEach(r=>{if(r.a==null&&r.b==null)return;
    hov(el("rect",{x:x(r.i)-7,y:Tp,width:14,height:H-B-Tp,class:"hit"},s),
      `<b>${r.t}</b><br><span class="k">${T("lg_sell10")}</span> ${r.a==null?"—":r.a.toFixed(2)+"%"}<br><span class="k">${T("lg_buy10")}</span> ${r.b==null?"—":r.b.toFixed(2)+"%"}`)});
  el("text",{class:"tick",x:Lx,y:H-B+16},s).textContent=rs[0].t;
  el("text",{class:"tick",x:W-R,y:H-B+16,"text-anchor":"end"},s).textContent=rs[rs.length-1].t;
}
function cTaker(){
  const W=880,H=230,Lx=46,R=14,Tp=16,B=34,s=mk("#c-taker",W,H);if(!s)return;
  const rs=hourly().map((r,i)=>({i,t:r[0],v:r[3]}));
  if(!rs.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const mid=(H-B+Tp)/2,y=v=>mid-((v-50)/50)*(mid-Tp),bw=(W-Lx-R)/rs.length-3;
  [0,25,50,75,100].forEach(g=>{el("line",{class:g===50?"ax":"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g+"%"});
  rs.forEach(r=>{const X=Lx+r.i*(W-Lx-R)/rs.length+1.5;
    if(r.v!=null){const up=r.v>=50;
      el("rect",{x:X,y:up?y(r.v):y(50),width:Math.max(1,bw),height:Math.max(1.5,Math.abs(y(r.v)-y(50))),rx:2,
        fill:up?"var(--info)":"var(--down)"},s)}
    hov(el("rect",{x:X-1.5,y:Tp,width:bw+3,height:H-B-Tp,class:"hit"},s),
      `<b>${r.t}</b><br>${r.v==null?"—":r.v.toFixed(1)+"%"}`)});
  el("text",{class:"tick",x:Lx,y:H-B+16},s).textContent=rs[0].t;
  el("text",{class:"tick",x:W-R,y:H-B+16,"text-anchor":"end"},s).textContent=rs[rs.length-1].t;
}
function cSweep(){
  const W=880,H=250,Lx=54,R=70,Tp=18,B=32,s=mk("#c-sweep",W,H);if(!s)return;
  const sw=(D.sweeps||[]).map(r=>[bkk(r.ts),r.side,Math.round(+r.total_kub),r.levels]);
  if(!sw.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const lo=Math.log10(180),hi=Math.log10(Math.max(40000,...sw.map(r=>r[2])));
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sw.length-1),y=v=>H-B-((Math.log10(v)-lo)/(hi-lo))*(H-B-Tp);
  [200,1000,5000,30000].forEach(g=>{el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g>=1000?g/1000+"k":g});
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  let big=0,bi=0;sw.forEach((r,i)=>{if(r[2]>big){big=r[2];bi=i}});
  sw.forEach((r,i)=>{const col=r[1]==="BUY"?"var(--info)":"var(--down)";
    el("circle",{cx:x(i),cy:y(r[2]),r:5.5,fill:col,stroke:"var(--card)","stroke-width":2},s);
    hov(el("circle",{cx:x(i),cy:y(r[2]),r:14,class:"hit"},s),
      `<b>${r[1]} ${fmt(r[2])} KUB</b><br><span class="k">at</span> ${r[0]}<br><span class="k">levels</span> ${r[3]}`)});
  el("text",{class:"dlab",x:Math.min(x(bi)+12,W-R-4),y:y(big)+4,fill:sw[bi][1]==="BUY"?"var(--info)":"var(--down)"},s)
    .textContent=fmt(big)+" KUB";
}
function tDex(){
  const d=D.dex||[],sizes=[...new Set(d.map(r=>+r.size_kub))].sort((a,b)=>a-b);
  let h=`<thead><tr><th>${T("th_size")}</th><th>${T("th_dex")}</th><th class="n">${T("th_out")}</th><th class="n">${T("th_px")}</th><th class="n">${T("th_vs")}</th></tr></thead><tbody>`;
  sizes.forEach(sz=>{d.filter(r=>+r.size_kub===sz).forEach((r,i)=>{
    h+=`<tr><td>${i===0?fmt(sz)+" KUB":""}</td><td>${r.dex}${r.is_best?' <span class="best">BEST</span>':""}</td>
      <td class="n">${fmt(r.usdt_out,4)}</td><td class="n">${fmt(r.px_usdt,6)}</td>
      <td class="n" style="color:${+r.vs_best_pct<-1?"var(--down)":"var(--ink-2)"}">${(+r.vs_best_pct).toFixed(2)}%</td></tr>`})});
  $("#t-dex").innerHTML=h+"</tbody>";
}
function treasury(){
  const cats=[["stake",T("g_stake"),"var(--accent)"],["fund",T("g_fund"),"var(--info)"],["cex_cold",T("g_cold"),"var(--ink-3)"]];
  const tot={stake:0,fund:0,cex_cold:0},cnt={stake:0,fund:0,cex_cold:0};
  (D.treasury||[]).forEach(t=>{if(tot[t.cat]==null)return;tot[t.cat]+=t.kub;cnt[t.cat]++});
  const grand=tot.stake+tot.fund+tot.cex_cold;if(!grand)return;
  const W=880,H=96,Tp=24,s=mk("#c-treas",W,H);let X=0;
  cats.forEach(([k,nm,col])=>{const w=tot[k]/grand*(W-4);
    el("rect",{x:X,y:Tp,width:Math.max(0,w-3),height:38,rx:6,fill:col},s);
    hov(el("rect",{x:X,y:Tp-6,width:Math.max(0,w-3),height:50,class:"hit"},s),
      `<b>${nm}</b><br>${fmt(tot[k])} KUB · ${cnt[k]} · ${(tot[k]/grand*100).toFixed(1)}%`);
    if(w>170){el("text",{class:"dlab",x:X+11,y:Tp+23,fill:"#fff"},s).textContent=(tot[k]/1e6).toFixed(1)+"M";
      el("text",{class:"tick",x:X,y:Tp-9},s).textContent=nm}
    X+=w});
  el("text",{class:"tick",x:0,y:Tp+54},s).textContent=fmt(grand)+" "+T("t_watched");
  let h=`<thead><tr><th>${T("th_wallet")}</th><th>${T("th_group")}</th><th class="n">${T("th_bal")}</th><th class="n">${T("th_share")}</th></tr></thead><tbody>`;
  (D.treasury||[]).slice(0,8).forEach(t=>{h+=`<tr><td>${t.label||"—"}</td><td><span class="tag">${t.cat}</span></td>
    <td class="n">${fmt(t.kub)}</td><td class="n">${(t.kub/grand*100).toFixed(1)}%</td></tr>`});
  $("#t-treas").innerHTML=h+"</tbody>";
}
function health(){
  const exp={"cex":288,"chain:cex_hot":288,"chain:cex_cold,fund,stake":24,"watch_balance":288,"whales":1,"alert:telegram":4,"dex_quotes":96};
  let h=`<thead><tr><th>${T("th_job")}</th><th class="n">${T("th_runs")}</th><th class="n">${T("th_fail")}</th><th>${T("th_state")}</th></tr></thead><tbody>`;
  (D.health||[]).forEach(r=>{const e=exp[r.job],partial=e&&r.runs<e*.9;
    const cls=r.failed?"down":partial?"mid":"up",txt=r.failed?`${r.failed} ${T("st_fail")}`:partial?T("st_ramp"):T("st_ok");
    h+=`<tr><td><span class="tag">${r.job}</span></td><td class="n">${r.runs}${e?` <span style="color:var(--ink-3)">/ ${e}</span>`:""}</td>
      <td class="n">${r.failed}</td><td><span class="chip ${cls}">${txt}</span></td></tr>`});
  $("#t-health").innerHTML=h+"</tbody>";
}

/* ---------------- orchestration ---------------- */
function render(){paintStatic();tfButtons();kpis();cCandles();tech();cSlip();tDex();cSlipT();cTaker();cSweep();treasury();health()}

function setTF(tf){
  TF=tf;try{localStorage.setItem("kfd-tf",tf)}catch(e){}
  document.querySelectorAll("#tfseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tf===tf)));
  if(!LIVE){render();return}
  fetch(`/api/candles?tf=${tf}&limit=300`).then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{CANDLES=(j.candles||[]).map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);CBARS=j.bars;render()})
    .catch(()=>render());
}

document.querySelectorAll(".seg button[data-lang]").forEach(b=>
  b.addEventListener("click",()=>{L=b.dataset.lang;try{localStorage.setItem("kfd-lang",L)}catch(e){}render()}));
try{
  const sv=localStorage.getItem("kfd-lang");
  if(sv&&I18N[sv])L=sv;
  else if((navigator.language||"").startsWith("th"))L="th";
  else if((navigator.language||"").startsWith("zh"))L="zh";
  const st=localStorage.getItem("kfd-tf");if(st&&TFS.some(t=>t[0]===st))TF=st;
}catch(e){}

render();
fetch("/api/data").then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
  if(!j||!j.now)return;
  D=j;LIVE=true;
  if(j.candles&&j.candles.candles){CANDLES=j.candles.candles.map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);CBARS=j.candles.bars}
  if(TF!==(j.candles&&j.candles.tf))setTF(TF);else render();
}).catch(()=>{});
</script>
