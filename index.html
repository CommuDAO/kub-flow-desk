<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUB Flow Desk</title>
<meta name="description" content="KUB market microstructure, execution cost, five-DEX quotes, exchange flow and chain activity.">
<meta name="color-scheme" content="dark">
<style>
/* TradingView tokens, dark only, to sit under the embedded chart. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --line:#2a2e39;
  --text-strong:#ffffff;
  --text-primary:#d1d4dc;
  --text-muted:#a3a6af;
  --up:#26a69a; --down:#ef5350; --accent:#4d8eff; --warn:#f2b705; --alt:#b07ce8;
  --s1:1px; --s2:2px; --s3:4px; --s4:5px; --s5:6px; --s6:7px; --s7:8px; --s8:11px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-2xl:24px;
  --dur:200ms;
  --sans:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text-primary);font-family:var(--sans);font-size:14px;line-height:19px;font-weight:400;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 56px;padding-left:16px;padding-right:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}

.mast{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s7) var(--s8);padding:var(--s8) 0}
.brand{display:flex;align-items:center;gap:var(--s7)}
.dot{width:20px;height:20px;border-radius:var(--r-sm);background:var(--up);flex:none}
.mast h1{margin:0;font-size:20px;line-height:26px;font-weight:600;color:var(--text-strong);letter-spacing:-.01em}
.mast .pair{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:var(--s7);flex-wrap:wrap}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap}
.seg button{font:500 12px/16px var(--sans);padding:var(--s4) var(--s8);background:transparent;
  color:var(--text-muted);border:0;border-radius:var(--r-sm);cursor:pointer;
  transition:background var(--dur),color var(--dur)}
.seg button:hover{background:#181a20;color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:#1e222d;color:var(--text-strong)}
.stamp{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.srcline{font-size:12px;line-height:18px;color:var(--text-muted);padding-bottom:var(--s8)}
.banner{border-left:3px solid var(--down);padding:var(--s4) 0 var(--s4) var(--s8);
  font-size:13px;color:var(--text-primary);margin-bottom:var(--s8)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:22px var(--s8);
  margin:var(--s7) 0 30px}
.kpi dt{margin:0;font-size:12px;line-height:16px;color:var(--text-muted);font-weight:400}
.kpi dd{margin:var(--s5) 0 0;font-family:var(--mono);font-size:21px;line-height:25px;font-weight:600;
  color:var(--text-strong);letter-spacing:-.01em}
.kpi .sub{font-size:12px;line-height:17px;color:var(--text-muted);margin-top:var(--s3)}
.kpi .sub b{font-weight:600;font-family:var(--mono);color:var(--text-primary)}

/* No card frames: sections are separated by space and one hairline. */
.card{margin:0 0 34px}
.card+.card{border-top:1px solid var(--line);padding-top:28px}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s5) var(--s8);margin-bottom:var(--s7)}
.ch h2{margin:0;font-size:16px;line-height:22px;font-weight:600;color:var(--text-strong)}
.ch .right{margin-left:auto;display:flex;align-items:center;gap:var(--s7);flex-wrap:wrap}
.fresh{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.why{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:19px;color:var(--text-muted);max-width:76ch}
.why b{display:block;font-weight:600;color:var(--text-primary);margin-bottom:var(--s3);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s8);margin:0 0 12px;padding:0;list-style:none;
  font-size:12px;color:var(--text-primary)}
.legend li{display:flex;align-items:center;gap:var(--s5)}
.sw{width:18px;height:3px;border-radius:var(--s2);flex:none}
.sw.dot{width:9px;height:9px;border-radius:50%}
.sw.box{width:11px;height:11px;border-radius:var(--s2)}

select{font:400 12px/16px var(--sans);color:var(--text-primary);background:#1e222d;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s4) var(--s7);cursor:pointer}
#langsel{font-weight:500}
.fold{font:500 12px/16px var(--sans);color:var(--text-muted);background:transparent;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:var(--s4) var(--s8);cursor:pointer;transition:color var(--dur)}
.fold:hover{color:var(--text-strong)}
.flowgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:14px 0 4px}
.flowtile{aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 13px 10px;display:flex;flex-direction:column;min-width:0}
.flowtile .ftop{flex:none;display:flex;align-items:baseline;justify-content:space-between;
  flex-wrap:wrap;gap:2px 10px;margin-bottom:6px}
.flowtile h3{margin:0;font-size:12.5px;line-height:16px;font-weight:600;color:var(--text-primary)}
.tlg{display:flex;gap:10px;font-size:10.5px;color:var(--text-muted);white-space:nowrap}
.tlg span{display:inline-flex;align-items:center;gap:4px}
.tlg i{width:8px;height:8px;border-radius:2px;flex:none}
.tlg i.dot{border-radius:50%}
.chartwrap{flex:1 1 auto;min-height:0;position:relative}
.chartwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flowtile .fnote{flex:none;margin-top:4px;font-size:10.5px;line-height:14px;color:var(--text-muted)}

.gtoggle{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;
  gap:6px;color:var(--text-primary);font:inherit;padding:2px 0}
.gtoggle:hover{color:var(--text-strong)}
.gtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
.gtoggle .arrow{display:inline-block;width:9px;flex:none;transition:transform var(--dur);color:var(--text-muted)}
.gtoggle[aria-expanded="true"] .arrow{transform:rotate(90deg)}
tr.subrow td:first-child{padding-left:26px;color:var(--text-muted)}

.linkbtn{text-decoration:none;display:inline-block}
#flowtop{margin-top:10px}
.panelhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.panelhead h3{margin:0;font-size:12.5px;font-weight:600;color:var(--text-primary)}
#flowtop td.dir{width:20px;text-align:center;padding-right:0}

#chainmix{margin-top:12px}
.mixbar{display:flex;height:9px;border-radius:4px;overflow:hidden;background:var(--line);margin-bottom:8px}
.mixbar i{height:100%;flex:none}
.mixlegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--text-primary);
  margin:0 0 6px;padding:0;list-style:none}
.mixlegend li{display:flex;align-items:center;gap:5px}
.mixlegend i{width:9px;height:9px;border-radius:2px;flex:none}

#tvwrap{height:min(64vh,540px);min-height:340px;border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
#tv-chart{height:100%;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{stroke:#4a5163;stroke-width:1}
.tick{font-family:var(--mono);font-size:11px;fill:var(--text-muted)}
.dlab{font-family:var(--mono);font-size:11px;font-weight:600}
.hit{fill:transparent;cursor:crosshair}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
th{text-align:left;font-size:12px;font-weight:400;color:var(--text-muted);
  padding:0 var(--s8) var(--s7) 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s7) var(--s8) var(--s7) 0;border-bottom:1px solid var(--line);
  vertical-align:baseline;color:var(--text-primary)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
tr:last-child td{border-bottom:0}
tr.noquote td{color:var(--text-muted)}
td .addr{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:var(--s3);font-size:12px;line-height:16px;
  padding:var(--s2) var(--s7);border-radius:var(--r-2xl);border:1px solid var(--line);color:var(--text-primary)}
.chip.up{color:var(--up)}.chip.down{color:var(--down)}.chip.mid{color:var(--text-muted)}
.chip.na{color:var(--text-muted)}
.best{background:var(--up);color:#00110f;font-size:11px;font-weight:600;padding:var(--s1) var(--s5);border-radius:var(--r-xs)}
.tag{font-family:var(--mono);font-size:11px;padding:var(--s1) var(--s5);border-radius:var(--r-xs);
  background:#1e222d;color:var(--text-primary)}
.note{font-size:12.5px;line-height:18px;color:var(--text-muted);margin:var(--s8) 0 0}
.note b{font-weight:600;color:var(--text-primary)}
.i{width:17px;height:17px;border-radius:50%;border:1px solid var(--text-muted);background:transparent;
  color:var(--text-muted);font:600 10px/1 var(--sans);cursor:pointer;padding:0;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color var(--dur),border-color var(--dur)}
.i::before{content:"i"}
.i:hover,.i[aria-expanded="true"]{color:var(--text-strong);border-color:var(--text-strong)}
#pop{position:fixed;z-index:40;display:none;max-width:min(400px,calc(100vw - 32px));
  background:#1e222d;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  font-size:13px;line-height:20px;color:var(--text-primary);box-shadow:rgba(0,0,0,.6) 0 6px 18px 0}
#pop[data-open="true"]{display:block}
#pop p{margin:0}
#pop p+p{margin-top:10px;color:var(--text-muted)}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity 150ms;
  background:#1e222d;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--s7) var(--s8);font-family:var(--mono);font-size:11.5px;line-height:16px;
  color:var(--text-strong);box-shadow:rgba(0,0,0,.6) 0 4px 12px 0;max-width:260px}
#tip .k{color:var(--text-muted)}
footer{margin-top:var(--s8);padding-top:var(--s8);border-top:1px solid var(--line);
  font-size:12.5px;line-height:18px;color:var(--text-muted)}
footer p{margin:0 0 var(--s7);max-width:76ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1 data-i18n="title">KUB Flow Desk</h1></div>

  <div class="srcline" data-i18n="src"></div>

  <section class="card">

  const sizes=[...new Set(all.map(r=>r.size))].sort((a,b)=>a-b);if(!sizes.length)return;
  const maxY=Math.max(.5,Math.ceil(Math.max(...all.map(r=>r.slip))*4)/4);
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sizes.length-1),y=v=>H-B-(v/maxY)*(H-B-Tp);

function exchange(){
  const ex=D.exchange||{},all=ex.flow||[];
  const days=(RANGES.find(r=>r[0]===EXRANGE)||[])[1]||7;
  const flow=all.slice(-days);
  const since=ex.collecting_since?Date.parse(ex.collecting_since):null;
  // A day the history walk has not reached is uncollected, not a quiet day.
  const uncovered=r=>r.covered===false||(r.covered==null&&since!=null&&Date.parse(r.day+"T23:59:59Z")<since);
  const net7=flow.filter(r=>!uncovered(r)).reduce((s,r)=>s+(+r.net||0),0);
  const k=(t,v,s)=>`<div class="kpi"><dt>${t}</dt><dd>${v}</dd><div class="sub">${s}</div></div>`;
  // Only the exchange's own wallets: its cold wallets plus the live hot one.
  const exCold=(D.treasury||[]).filter(t=>t.cat==="cex_cold");
  const exHot=(D.treasury||[]).filter(t=>t.cat==="cex_hot");
  const sumK=a=>a.reduce((s,r)=>s+r.kub,0);
  const bal=ex.balance!=null?ex.balance:sumK(exCold)+sumK(exHot);
  $("#exkpis").innerHTML=
     k(T("ex_bal"),fmt(bal)+" KUB",
       `${T("ex_cold")} <b>${fmt(sumK(exCold))}</b> (${exCold.length}) · ${T("ex_hot")} <b>${fmt(sumK(exHot))}</b> (${exHot.length})`)
    +k(T("ex_net"),(net7>=0?"+":"")+fmt(net7)+" KUB",tpl("ex_days",{n:flow.filter(r=>!uncovered(r)).length}));

  const W=880,H=250,Lx=62,R=64,Tp=18,B=40,s=mk("#c-exflow",W,H);if(!s)return;
  if(!flow.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const hi=Math.max(100,...flow.flatMap(r=>[+r.in||0,+r.out||0]));
  const mid=(H-B+Tp)/2,y=v=>mid-(v/hi)*(mid-Tp);
  // A running total over the range, so the eye does not have to add the bars
  // up. Uncollected days carry the previous value instead of flattening it.
  let run=0;
  const cum=flow.map(r=>{if(!uncovered(r))run+=(+r.net||0);return run});
  const cHi=Math.max(1,...cum.map(Math.abs));
  const y2=v=>mid-(v/cHi)*(mid-Tp);
  const slot=(W-Lx-R)/flow.length;
  // Two bars per day while they still fit; below that, one slot-wide pair.
  const paired=slot>=8,bw=paired?Math.min(26,slot/2-2):Math.max(.8,slot*.42);
  const sparse=flow.length>14;
  [hi,hi/2,0,-hi/2,-hi].forEach(g=>{el("line",{class:g===0?"ax":"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=fmt(Math.abs(g))});
  [cHi,cHi/2,-cHi/2,-cHi].forEach(g=>el("text",{class:"tick",x:W-R+9,y:y2(g)+3.5,fill:"var(--accent)"},s)
    .textContent=(g>=0?"+":"−")+(Math.abs(g)>=1000?fmt(Math.abs(g)/1000,0)+"k":fmt(Math.abs(g))));
  flow.forEach((r,i)=>{
    const cx=Lx+slot*i+slot/2;
    const uncollected=uncovered(r);
    if(uncollected){
      el("rect",{x:cx-slot/2,y:Tp,width:Math.max(.8,slot),height:H-B-Tp,fill:"#14171f"},s);
      if(!sparse)el("text",{class:"tick",x:cx,y:mid+4,"text-anchor":"middle"},s).textContent=T("ex_nodata");
    }else{
      const i0=+r.in||0,o0=+r.out||0;
      const xi=paired?cx-bw-1:cx-bw/2,xo=paired?cx+1:cx-bw/2;
      el("rect",{x:xi,y:y(i0),width:bw,height:Math.max(1,mid-y(i0)),rx:paired?2:0,fill:"var(--up)"},s);
      el("rect",{x:xo,y:mid,width:bw,height:Math.max(1,mid-y(o0)),rx:paired?2:0,fill:"var(--down)",
        "fill-opacity":paired?1:.85},s);
    }
    if(!sparse)el("text",{class:"tick",x:cx,y:H-B+18,"text-anchor":"middle"},s).textContent=dmy(r.day);
  });
  el("path",{d:"M"+flow.map((r,i)=>[Lx+slot*i+slot/2,y2(cum[i])].join(" ")).join(" L "),
    fill:"none",stroke:"var(--accent)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},s);
  if(flow.length<=31)flow.forEach((r,i)=>el("circle",
    {cx:Lx+slot*i+slot/2,cy:y2(cum[i]),r:3,fill:"var(--accent)",stroke:"var(--bg)","stroke-width":1.5},s));
  flow.forEach((r,i)=>{
    const cx=Lx+slot*i+slot/2;
    const hit=el("rect",{x:cx-slot/2,y:Tp,width:Math.max(3,slot),height:H-B-Tp,class:"hit",style:"cursor:pointer"},s);
    hov(hit,
      uncovered(r)?`<b>${dmy(r.day)}</b><br>${T("ex_nodata")}<br><span class="k">${T("ex_cum")}</span> ${fmt(cum[i])}`
      :`<b>${dmy(r.day)}</b><br><span class="k">${T("ex_in")}</span> ${fmt(r.in)} (${r.in_tx})<br><span class="k">${T("ex_out")}</span> ${fmt(r.out)} (${r.out_tx})<br><span class="k">net</span> ${fmt(r.net)}<br><span class="k">${T("ex_cum")}</span> ${fmt(cum[i])}`);
    hit.addEventListener("click",()=>showFlowTop(r.day));
  });
  if(sparse){
    el("text",{class:"tick",x:Lx,y:H-B+18},s).textContent=dmy(flow[0].day);
    el("text",{class:"tick",x:W-R,y:H-B+18,"text-anchor":"end"},s).textContent=dmy(flow[flow.length-1].day);
  }
}

function showFlowTop(dayStr){

}

function treasury(){
  const MAP={stake:"stake",fund:"fund",cex_cold:"cex",cex_hot:"cex",reserve:"reserve"};
  const tot={stake:0,fund:0,cex:0,reserve:0},cnt={stake:0,fund:0,cex:0,reserve:0};
  (D.treasury||[]).forEach(t=>{const g=MAP[t.cat];if(!g)return;tot[g]+=t.kub;cnt[g]++});
  const watched=tot.stake+tot.fund+tot.cex+tot.reserve;
  const others=(D.other||[]).filter(r=>!r.kkub);
  const kkub=(D.supply&&D.supply.kkub)||((D.other||[]).find(r=>r.kkub)||{}).kub||0;
  const reserve=others.filter(r=>r.cat==="reserve");
  const unid=others.filter(r=>r.cat!=="reserve");
  const sum=a=>a.reduce((s,r)=>s+r.kub,0);
  const total=(D.supply&&D.supply.total)||0;
  if(!watched)return;
  const grand=total||watched+kkub+sum(others);
  const rest=Math.max(0,grand-watched-kkub-sum(unid));

  const segs=[["stake",T("g_stake"),"var(--up)",tot.stake,cnt.stake],
              ["fund",T("g_fund"),"var(--accent)",tot.fund,cnt.fund],
              ["cex",T("g_cold"),"var(--warn)",tot.cex,cnt.cex],
              ["kkub",T("g_kkub"),"var(--alt)",kkub,1],
              ["reserve",T("g_reserve"),"#e07b39",tot.reserve+sum(reserve),cnt.reserve+reserve.length],
              ["unid",T("g_unid"),"#7f8694",sum(unid),unid.length],
              ["rest",T("g_rest"),"#3a3f4b",rest,null]].filter(g=>g[3]>0);

  $("#treaslegend").innerHTML=segs.map(g=>
    `<li><span class="sw box" style="background:${g[2]}"></span><span>${g[1]} · ${(g[3]/grand*100).toFixed(1)}%</span></li>`).join("");

  const W=880,H=92,Tp=18,s=mk("#c-treas",W,H);let X=0;
  segs.forEach(g=>{const w=g[3]/grand*(W-4);
    el("rect",{x:X,y:Tp,width:Math.max(0,w-2),height:40,rx:3,fill:g[2]},s);
    hov(el("rect",{x:X,y:Tp-6,width:Math.max(0,w-2),height:52,class:"hit"},s),
      `<b>${g[1]}</b><br>${fmt(g[3])} KUB${g[4]?" · "+g[4]:""}<br>${(g[3]/grand*100).toFixed(1)}%`);
    if(w>96)el("text",{class:"dlab",x:X+9,y:Tp+25,fill:g[0]==="rest"||g[0]==="unid"?"var(--text-primary)":"#0b0b0b"},s)
      .textContent=(g[3]/1e6).toFixed(2)+"M";
    X+=w});
  el("text",{class:"tick",x:0,y:Tp+56},s).textContent=
    tpl("t_supply",{watched:fmt(watched),total:fmt(grand),pct:(watched/grand*100).toFixed(1)});

  // A category held by several wallets shows one combined row, named by the
  // tag kubscan publishes for it with the "#7" / "(Cold-3)" instance suffix
  // stripped, and opens to the individual wallets underneath. A category with
  // only one wallet just shows that wallet directly.
  const grpName=label=>{
    if(!label)return null;
    const g=label.replace(/\s*#\d+\s*$/,"").replace(/\s*\((?:cold|hot)[^)]*\)\s*$/i,"").trim();
    return g||label;
  };
  const groups=new Map();
  const addTo=(cat,label,kub)=>{
    const key=cat+"|"+grpName(label);
    if(!groups.has(key))groups.set(key,{cat,name:grpName(label),kub:0,members:[]});
    const e=groups.get(key);e.kub+=kub;e.members.push({label,kub});
  };
  (D.treasury||[]).forEach(t=>addTo(t.cat,t.label,t.kub));
  const kkubRow=(D.other||[]).find(r=>r.kkub);
  if(kkub>0)addTo(kkubRow?kkubRow.cat:"wrapped",kkubRow?kkubRow.label:"Wrapped KUB (KKUB)",kkub);
  const groupRows=[...groups.values()].sort((a,b)=>b.kub-a.kub);

  let h=`<thead><tr><th>${T("th_wallet")}</th><th>${T("th_group")}</th><th class="n">${T("th_bal")}</th><th class="n">${T("th_share")}</th></tr></thead><tbody>`;
  const pct=kub=>(kub/grand*100).toFixed(1)+"%";
  groupRows.forEach((g,gi)=>{
    if(g.members.length>1){
      const gid="g"+gi;
      h+=`<tr class="grouprow"><td><button class="gtoggle" type="button" data-g="${gid}" aria-expanded="false" aria-label="${T("grp_toggle")}"><span class="arrow">▸</span>${g.name}<span style="color:var(--text-muted);font-weight:400"> · ${tpl("grp_wallets",{n:g.members.length})}</span></button></td>
        <td><span class="tag">${g.cat}</span></td><td class="n">${fmt(g.kub)}</td><td class="n">${pct(g.kub)}</td></tr>`;
      g.members.sort((a,b)=>b.kub-a.kub).forEach(m=>{
        h+=`<tr class="subrow" data-g="${gid}" hidden><td>${m.label||"—"}</td><td></td><td class="n">${fmt(m.kub)}</td><td class="n">${pct(m.kub)}</td></tr>`;
      });
    }else{
      const m=g.members[0];
      h+=`<tr><td>${m.label||g.name}</td><td><span class="tag">${g.cat}</span></td><td class="n">${fmt(g.kub)}</td><td class="n">${pct(g.kub)}</td></tr>`;
    }
  });
  // An address kubscan carries no label for is shown as the address itself —
  // no placeholder text standing in for a name nobody has.
  unid.slice(0,8).forEach(r=>{
    h+=`<tr><td>${r.label?r.label:`<span class="addr">${short(r.address)}</span>`}</td><td><span class="tag">${r.cat||"unidentified"}</span></td>
      <td class="n">${fmt(r.kub)}</td><td class="n">${pct(r.kub)}</td></tr>`;
  });
  $("#t-treas").innerHTML=h+"</tbody>";
  $("#t-treas").querySelectorAll(".gtoggle").forEach(b=>b.addEventListener("click",()=>{
    const open=b.getAttribute("aria-expanded")!=="true";
    b.setAttribute("aria-expanded",String(open));
    document.querySelectorAll(`tr.subrow[data-g="${b.dataset.g}"]`).forEach(tr=>{tr.hidden=!open});
  }));
}
function health(){
  const exp={"cex":288,"chain:cex_hot":288,"chain:cex_cold,fund,stake":24,"watch_balance":288,"whales":1,
             "alert:telegram":4,"dex_quotes":96,"supply":24,"chain_daily":24,"chain_fees":288};
  const rows=D.health||[];
  let okN=0;
  let h=`<thead><tr><th>${T("th_job")}</th><th class="n">${T("th_runs")}</th><th class="n">${T("th_fail")}</th><th>${T("th_state")}</th></tr></thead><tbody>`;
  rows.forEach(r=>{const e=exp[r.job],partial=e&&r.runs<e*.9;
    const cls=r.failed?"down":partial?"mid":"up",txt=r.failed?`${r.failed} ${T("st_fail")}`:partial?T("st_ramp"):T("st_ok");
    if(!r.failed&&!partial)okN++;
    h+=`<tr><td><span class="tag">${r.job}</span></td><td class="n">${r.runs}${e?` <span style="color:var(--text-muted)">/ ${e}</span>`:""}</td>
      <td class="n">${r.failed}</td><td><span class="chip ${cls}">${txt}</span></td></tr>`});
  $("#t-health").innerHTML=h+"</tbody>";
  $("#healthsum").textContent=tpl("health_sum",{ok:okN,n:rows.length});
  const body=$("#healthbody"),btn=$("#healthfold");
  btn.textContent=body.hidden?T("fold_show"):T("fold_hide");
  btn.setAttribute("aria-expanded",String(!body.hidden));
}

function render(){
  paintStatic();tfButtons();rangeButtons();exRangeButtons();techRangeButtons();
  kpis();tech();cSlip();cSlipT();cTaker();cSweep();
  dexSelect();tDex();exchange();cChain();treasury();health();
}
function setTF(tf){
  TF=tf;try{localStorage.setItem("kfd-tf",tf)}catch(e){}
  document.querySelectorAll("#tfseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===tf)));
  $("#techtf").textContent=techLabel();
  mountTV();
  if(!LIVE){render();return}
  fetch(`/api/candles?tf=${tf}&limit=300`).then(r=>r.json())
    .then(j=>{CANDLES=(j.candles||[]).map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);render()})
    .catch(()=>render());
}
$("#langsel").addEventListener("change",e=>{
  L=e.target.value;try{localStorage.setItem("kfd-lang",L)}catch(e){}render();mountTV()});
$("#dexsize").addEventListener("change",e=>{DEXSIZE=+e.target.value;tDex()});
$("#flowtopClose").addEventListener("click",()=>{$("#flowtop").hidden=true;flowTopReq++});
$("#healthfold").addEventListener("click",()=>{
  const body=$("#healthbody");body.hidden=!body.hidden;
  $("#healthfold").textContent=body.hidden?T("fold_show"):T("fold_hide");
  $("#healthfold").setAttribute("aria-expanded",String(!body.hidden));
  try{localStorage.setItem("kfd-health",body.hidden?"0":"1")}catch(e){}
});
try{
  const sv=localStorage.getItem("kfd-lang");
  if(sv&&I18N[sv])L=sv;
  else{const nl=(navigator.language||"").toLowerCase();
    const hit=["th","zh","ms","vi","id"].find(k=>nl.startsWith(k))||(nl.startsWith("fil")||nl.startsWith("tl")?"fil":null);
    if(hit)L=hit;}
  const st=localStorage.getItem("kfd-tf");if(st&&TFS.some(t=>t[0]===st))TF=st;
  const sr=localStorage.getItem("kfd-range");if(sr&&RANGES.some(r=>r[0]===sr))RANGE=sr;
  const se=localStorage.getItem("kfd-exrange");if(se&&RANGES.some(r=>r[0]===se))EXRANGE=se;
  const st2=localStorage.getItem("kfd-techrange");if(st2&&(st2==="tf"||RANGES.some(r=>r[0]===st2)))TECHRANGE=st2;
  if(localStorage.getItem("kfd-health")==="1")$("#healthbody").hidden=false;
}catch(e){}

render();mountTV();
fetch("/api/data").then(r=>r.json()).then(j=>{
  if(!j)return;
  if(j.now){D=j;LIVE=true;DEXSIZE=null;
    if(j.candles&&j.candles.candles){CANDLES=j.candles.candles.map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]])}
    if(TF!==(j.candles&&j.candles.tf))setTF(TF);else render();
  }else if(j.error){D=SNAP;LIVE=false;D.errors=[j.error];render();
    $("#banner").hidden=false;$("#banner").textContent=T("apierr")+j.error}
}).catch(()=>{});
</script>
