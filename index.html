<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUB Flow Desk</title>
<meta name="description" content="KUB market microstructure, execution cost, five-DEX quotes, exchange flow and chain activity.">
<meta name="color-scheme" content="dark">
<style>
/* TradingView tokens, dark only, to sit under the embedded chart. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --line:#2a2e39;
  --text-strong:#ffffff;
  --text-primary:#d1d4dc;
  --text-muted:#a3a6af;
  --up:#26a69a; --down:#ef5350; --accent:#4d8eff; --warn:#f2b705; --alt:#b07ce8;
  --s1:1px; --s2:2px; --s3:4px; --s4:5px; --s5:6px; --s6:7px; --s7:8px; --s8:11px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-2xl:24px;
  --dur:200ms;
  --sans:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text-primary);font-family:var(--sans);font-size:14px;line-height:19px;font-weight:400;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 56px;padding-left:16px;padding-right:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}

.mast{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s7) var(--s8);padding:var(--s8) 0}
.brand{display:flex;align-items:center;gap:var(--s7)}
.dot{width:20px;height:20px;border-radius:var(--r-sm);background:var(--up);flex:none}
.mast h1{margin:0;font-size:20px;line-height:26px;font-weight:600;color:var(--text-strong);letter-spacing:-.01em}
.mast .pair{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:var(--s7);flex-wrap:wrap}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap}
.seg button{font:500 12px/16px var(--sans);padding:var(--s4) var(--s8);background:transparent;
  color:var(--text-muted);border:0;border-radius:var(--r-sm);cursor:pointer;
  transition:background var(--dur),color var(--dur)}
.seg button:hover{background:#181a20;color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:#1e222d;color:var(--text-strong)}
.stamp{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.srcline{font-size:12px;line-height:18px;color:var(--text-muted);padding-bottom:var(--s8)}
.banner{border-left:3px solid var(--down);padding:var(--s4) 0 var(--s4) var(--s8);
  font-size:13px;color:var(--text-primary);margin-bottom:var(--s8)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:22px var(--s8);
  margin:var(--s7) 0 30px}
.kpi dt{margin:0;font-size:12px;line-height:16px;color:var(--text-muted);font-weight:400}
.kpi dd{margin:var(--s5) 0 0;font-family:var(--mono);font-size:21px;line-height:25px;font-weight:600;
  color:var(--text-strong);letter-spacing:-.01em}
.kpi .sub{font-size:12px;line-height:17px;color:var(--text-muted);margin-top:var(--s3)}
.kpi .sub b{font-weight:600;font-family:var(--mono);color:var(--text-primary)}

/* No card frames: sections are separated by space and one hairline. */
.card{margin:0 0 34px}
.card+.card{border-top:1px solid var(--line);padding-top:28px}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s5) var(--s8);margin-bottom:var(--s7)}
.ch h2{margin:0;font-size:16px;line-height:22px;font-weight:600;color:var(--text-strong)}
.ch .right{margin-left:auto;display:flex;align-items:center;gap:var(--s7);flex-wrap:wrap}
.fresh{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.why{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:19px;color:var(--text-muted);max-width:76ch}
.why b{display:block;font-weight:600;color:var(--text-primary);margin-bottom:var(--s3);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s8);margin:0 0 12px;padding:0;list-style:none;
  font-size:12px;color:var(--text-primary)}
.legend li{display:flex;align-items:center;gap:var(--s5)}
.sw{width:18px;height:3px;border-radius:var(--s2);flex:none}
.sw.dot{width:9px;height:9px;border-radius:50%}
.sw.box{width:11px;height:11px;border-radius:var(--s2)}

select{font:400 12px/16px var(--sans);color:var(--text-primary);background:#1e222d;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s4) var(--s7);cursor:pointer}
.fold{font:500 12px/16px var(--sans);color:var(--text-muted);background:transparent;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:var(--s4) var(--s8);cursor:pointer;transition:color var(--dur)}
.fold:hover{color:var(--text-strong)}
.sub-panel{margin:0 0 22px}
.sub-panel[hidden]{display:none}
.sub-panel h3{margin:0 0 var(--s5);font-size:13px;line-height:18px;font-weight:600;color:var(--text-primary)}

#tvwrap{height:min(64vh,540px);min-height:340px;border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
#tv-chart{height:100%;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{stroke:#4a5163;stroke-width:1}
.tick{font-family:var(--mono);font-size:11px;fill:var(--text-muted)}
.dlab{font-family:var(--mono);font-size:11px;font-weight:600}
.hit{fill:transparent;cursor:crosshair}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
th{text-align:left;font-size:12px;font-weight:400;color:var(--text-muted);
  padding:0 var(--s8) var(--s7) 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s7) var(--s8) var(--s7) 0;border-bottom:1px solid var(--line);
  vertical-align:baseline;color:var(--text-primary)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
tr:last-child td{border-bottom:0}
tr.noquote td{color:var(--text-muted)}
td .addr{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:var(--s3);font-size:12px;line-height:16px;
  padding:var(--s2) var(--s7);border-radius:var(--r-2xl);border:1px solid var(--line);color:var(--text-primary)}
.chip.up{color:var(--up)}.chip.down{color:var(--down)}.chip.mid{color:var(--text-muted)}
.chip.na{color:var(--text-muted)}
.best{background:var(--up);color:#00110f;font-size:11px;font-weight:600;padding:var(--s1) var(--s5);border-radius:var(--r-xs)}
.tag{font-family:var(--mono);font-size:11px;padding:var(--s1) var(--s5);border-radius:var(--r-xs);
  background:#1e222d;color:var(--text-primary)}
.note{font-size:12.5px;line-height:18px;color:var(--text-muted);margin:var(--s8) 0 0}
.note b{font-weight:600;color:var(--text-primary)}
.i{width:17px;height:17px;border-radius:50%;border:1px solid var(--text-muted);background:transparent;
  color:var(--text-muted);font:600 10px/1 var(--sans);cursor:pointer;padding:0;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color var(--dur),border-color var(--dur)}
.i::before{content:"i"}
.i:hover,.i[aria-expanded="true"]{color:var(--text-strong);border-color:var(--text-strong)}
#pop{position:fixed;z-index:40;display:none;max-width:min(400px,calc(100vw - 32px));
  background:#1e222d;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  font-size:13px;line-height:20px;color:var(--text-primary);box-shadow:rgba(0,0,0,.6) 0 6px 18px 0}
#pop[data-open="true"]{display:block}
#pop p{margin:0}
#pop p+p{margin-top:10px;color:var(--text-muted)}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity 150ms;
  background:#1e222d;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:var(--s7) var(--s8);font-family:var(--mono);font-size:11.5px;line-height:16px;
  color:var(--text-strong);box-shadow:rgba(0,0,0,.6) 0 4px 12px 0;max-width:260px}
#tip .k{color:var(--text-muted)}
footer{margin-top:var(--s8);padding-top:var(--s8);border-top:1px solid var(--line);
  font-size:12.5px;line-height:18px;color:var(--text-muted)}
footer p{margin:0 0 var(--s7);max-width:76ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1 data-i18n="title">KUB Flow Desk</h1></div>
    <span class="pair">KUB_THB · BITKUB</span>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
      <span class="stamp" id="stamp"></span>
    </div>
  </header>
  <div class="srcline" data-i18n="src"></div>
  <div class="banner" id="banner" hidden></div>
  <dl class="kpis" id="kpis"></dl>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_chart"></h2><button class="i" type="button" aria-expanded="false" data-info="n_tv"></button>
      <div class="right"><div class="seg" id="tfseg" role="group" aria-label="Timeframe"></div>
        <span class="fresh" data-fresh="price"></span></div>
    </div>
    <div id="tvwrap"><div id="tv-chart"></div></div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_chart"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_tech"></h2><button class="i" type="button" aria-expanded="false" data-info="l_tech"></button>
      <div class="right"><span class="fresh" id="techtf"></span><span class="fresh" data-fresh="hourly"></span></div>
    </div>
    <div class="tw"><table id="t-tech"></table></div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_tech"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_flow"></h2><button class="i" type="button" aria-expanded="false" data-info="l_flow l_cost"></button>
      <div class="right"><span class="fresh" data-fresh="book"></span></div>
    </div>
    <div class="seg" id="subseg" role="group" aria-label="Charts"></div>
    <div style="height:14px"></div>

    <div class="sub-panel" data-sub="cost">
      <h3 data-i18n="sub_cost"></h3>
      <ul class="legend">
        <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell"></span></li>
        <li><span class="sw" style="background:var(--up)"></span><span data-i18n="lg_buy"></span></li>
      </ul>
      <div id="c-slip"></div>
      <p class="note" id="slipnote"></p>
    </div>

    <div class="sub-panel" data-sub="slipt">
      <h3 data-i18n="sub_slipt"></h3>
      <ul class="legend">
        <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell10"></span></li>
        <li><span class="sw" style="background:var(--up)"></span><span data-i18n="lg_buy10"></span></li>
      </ul>
      <div id="c-slipt"></div>
    </div>

    <div class="sub-panel" data-sub="taker">
      <h3 data-i18n="sub_taker"></h3>
      <ul class="legend">
        <li><span class="sw dot" style="background:var(--up)"></span><span data-i18n="lg_bcross"></span></li>
        <li><span class="sw dot" style="background:var(--down)"></span><span data-i18n="lg_scross"></span></li>
      </ul>
      <div id="c-taker"></div>
    </div>

    <div class="sub-panel" data-sub="sweep">
      <h3 data-i18n="sub_sweep"></h3>
      <div id="c-sweep"></div>
    </div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_flow"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_dex"></h2><button class="i" type="button" aria-expanded="false" data-info="l_dex n_dex"></button>
      <div class="right">
        <label class="fresh" for="dexsize" data-i18n="dex_size"></label>
        <select id="dexsize"></select>
        <span class="fresh" data-fresh="dex"></span>
      </div>
    </div>
    <div class="tw"><table id="t-dex"></table></div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_dex"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_ex"></h2><button class="i" type="button" aria-expanded="false" data-info="l_ex n_ex"></button>
      <div class="right"><div class="seg" id="exseg" role="group" aria-label="Range"></div>
        <span class="fresh" data-fresh="exchange"></span></div>
    </div>
    <dl class="kpis" id="exkpis"></dl>
    <ul class="legend">
      <li><span class="sw box" style="background:var(--up)"></span><span data-i18n="ex_in"></span></li>
      <li><span class="sw box" style="background:var(--down)"></span><span data-i18n="ex_out"></span></li>
    </ul>
    <div id="c-exflow"></div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_ex"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_chain"></h2><button class="i" type="button" aria-expanded="false" data-info="l_chain n_chain"></button>
      <div class="right"><div class="seg" id="chainseg" role="group" aria-label="Range"></div>
        <span class="fresh" data-fresh="chain"></span></div>
    </div>
    <ul class="legend">
      <li><span class="sw box" style="background:var(--accent)"></span><span data-i18n="ch_fees"></span></li>
      <li><span class="sw" style="background:var(--warn)"></span><span data-i18n="ch_tx"></span></li>
    </ul>
    <div id="c-chain"></div>
    <p class="note" id="chainnote"></p>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_chain"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_treas"></h2><button class="i" type="button" aria-expanded="false" data-info="l_treas n_treas"></button>
      <div class="right"><span class="fresh" data-fresh="treasury"></span></div>
    </div>
    <ul class="legend" id="treaslegend"></ul>
    <div id="c-treas"></div>
    <div class="tw" style="margin-top:14px"><table id="t-treas"></table></div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_treas"></span></p>
  </section>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_health"></h2><button class="i" type="button" aria-expanded="false" data-info="l_health"></button>
      <div class="right"><span class="fresh" id="healthsum"></span>
        <button class="fold" type="button" id="healthfold" aria-expanded="false" aria-controls="healthbody"></button></div>
    </div>
    <div id="healthbody" hidden>
      <div class="tw"><table id="t-health"></table></div>
    </div>
    <p class="why"><b data-i18n="why_title"></b><span data-i18n="w_health"></span></p>
  </section>

  <footer>
    <p data-i18n="f1"></p>
    <p data-i18n="f2"></p>
    <p style="margin-top:10px" data-i18n="f3"></p>
  </footer>
</div>
<div id="pop" role="note"></div>
<div id="tip" role="status" aria-live="polite"></div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const I18N={
en:{ex_days:"{n} days shown",ex_cold:"cold",ex_hot:"hot",title:"KUB Flow Desk",info:"More information",why_title:"What this tells you",
 fresh_at:"read {t}",fresh_none:"no data yet",
 src:"Bitkub public API v3 every 5 min · kubscan v2 (41 wallets) every 5 min · KUB Chain RPC (5 DEXes) every 15 min · chain activity from kubscan hourly · price chart by TradingView",
 k_offer:"Lowest offer",k_vol:"24 h volume",k_sell:"Sell 10k KUB",k_nf:"Left the exchange",k_taker:"Buyers crossing",
 k_spread:"spread",k_lv:"levels",k_trades:"trades",k_bid:"bid",k_last:"last",k_ticker:"Bitkub ticker",
 h_chart:"KUB / THB",
 n_tv:"The chart is provided by TradingView from Bitkub's own KUBTHB feed, which carries years of history and a complete set of drawing tools, beyond what the data KUB Flow collects can offer. Every panel below the chart is measured by KUB Flow from its own trade record.",
 w_chart:"Where price has been, at a glance, with the history and drawing tools a chart needs. It answers the direction question so the panels below can answer the ones a price chart cannot: what a trade would cost, who is paying the spread, and where the supply sits.",
 h_tech:"Indicator readings",
 l_tech:"These values are calculated by KUB Flow from the bars it collects, and are not read from the chart above, so they reconcile with the execution-cost, sweep and taker panels below. Each row states where the value sits against its conventional threshold, and how many bars were used. An indicator whose period exceeds the bars collected is reported as unavailable rather than estimated.",
 w_tech:"The standard momentum, trend and volatility readings in one table, each with the number of bars behind it. The bar count is the point: a reading computed from too few bars is shown as unavailable, so a number on this page is never more confident than the data under it.",
 tf_bars:"{bars} bars collected at {tf}",
 th_ind:"Indicator",th_val:"Value",th_pos:"Position",th_bars:"Bars",
 p_over:"above {n}",p_under:"below {n}",p_between:"between {a} and {b}",p_na:"not enough bars",
 p_above_sig:"above signal",p_below_sig:"below signal",p_px_above:"price above",p_px_below:"price below",
 p_in_band:"inside bands",p_above_band:"above upper band",p_below_band:"below lower band",p_value:"reading",
 h_flow:"Order flow and execution cost",
 l_flow:"Four views of the same order book and trade record, shown together because they answer one question between them. Any of them can be switched off.",
 l_cost:"Bitkub's own book can be dragged to price a sweep by hand, at the current moment. KUB Flow does it automatically at fixed sizes, every five minutes, keeps the series, and puts the result beside the on-chain venues — the value is the history and the comparison, not the arithmetic.",
 w_flow:"What a trade of a given size would actually cost, how that cost has been moving, which side is paying the spread, and which single orders cleared several price levels at once. Together they describe liquidity: a market can look calm on the chart while the cost of getting out of it is rising.",
 sub_cost:"Cost by order size, current book",
 sub_slipt:"Cost of a 10,000 KUB order, hour by hour",
 sub_taker:"Which side crossed the spread, hourly",
 sub_sweep:"Orders clearing three or more price levels",
 lg_sell:"Sell into the bid side",lg_buy:"Buy into the ask side",
 lg_sell10:"Sell 10k",lg_buy10:"Buy 10k",
 lg_bcross:"Buyers crossing",lg_scross:"Sellers crossing",
 h_dex:"On-chain price across five DEXes",dex_size:"Order size",
 l_dex:"An eth_call is issued directly to each venue's router and quoter, without any third-party API, to compare which venue returns the most for the same size. Each venue is quoted against whichever dollar token it actually holds a pool in, with that token's own decimals.",
 n_dex:"Each venue is quoted as a single pool. Junoswap can split one order across several pools, which KUB Flow does not yet model, so its figure is a floor rather than the best price available. Kublerx prices against Bridged Tether USD rather than Bitkub-Peg KUSDT — a different contract, the same dollar.",
 w_dex:"Whether the on-chain price is worth using instead of the exchange, and where. The comparison is per size, because a venue that wins on 100 KUB can lose badly on 5,000: the gap between them is the cost of routing to the wrong one.",
 no_quote:"no pool",
 th_dex:"DEX",th_out:"USD out",th_px:"Per KUB",th_vs:"vs best",th_tok:"Quoted in",
 h_ex:"KUB held at Bitkub Exchange",
 l_ex:"Only the exchange's own wallets are counted here — its cold wallets and its active hot wallet — read every five minutes. Ecosystem funds, the stake vault and the company reserve are not the exchange's and are left to the supply panel. Transfers in and out are read from the chain, by day, in Bangkok time, and the history is walked backwards a page at a time from kubscan.",
 n_ex:"Days before collection began are marked as uncollected rather than drawn as zero flow. The exchange moves KUB between its own wallets too; only transfers crossing the boundary are counted.",
 w_ex:"Whether coins are moving onto the exchange or away from it. Sustained flow onto an exchange puts sellable supply within reach of the order book; flow away from it takes supply out of immediate circulation. Neither predicts price, but both change what the book can absorb.",
 ex_in:"Onto the exchange",ex_out:"Off the exchange",ex_net:"Net out, period",
 ex_bal:"Held by the exchange",ex_nodata:"not collected",
 h_chain:"Chain activity",
 l_chain:"Daily totals from kubscan. Transaction counts come from its chart endpoint, which reaches back about a month; fees are fetched one day at a time and go back as far as the backfill has walked. Both are read from kubscan, so both match what kubscan reports for the same day.",
 n_chain:"Gas units are deliberately not shown. kubscan quotes a flat 25 gwei, but that is the price offered for a new transaction, not the average actually paid: on 19 Sep it measured 9,466,430,334 gas against 190.41 KUB of fees, an effective 20.1 gwei. Dividing fees by 25 gwei would understate gas by about a fifth, and there is no per-day gas figure to use instead.",
 w_chain:"How much the chain is actually being used, in fees paid and transactions settled. It is the demand side behind everything else on this page: a market's depth and an exchange's flow both sit on top of a chain that people are either using or not. The newest day here is the last one kubscan has closed, so it trails the running totals on their front page by a day.",
 ch_fees:"Fees paid, KUB",ch_tx:"Transactions",ch_avg:"Average fee per transaction",
 r_7d:"7d",r_1m:"1M",r_3m:"3M",r_1y:"1Y",

function BB(c,n=20,k=2){if(c.length<n)return null;const m=SMA(c,n),w=c.slice(-n);
  const sd=Math.sqrt(w.reduce((s,v)=>s+(v-m)*(v-m),0)/n);return{mid:m,up:m+k*sd,low:m-k*sd}}

// Panel commentary sits behind the info button instead of running as body copy.
const pop=$("#pop");
let popBtn=null;
function closePop(){if(popBtn){popBtn.setAttribute("aria-expanded","false");popBtn=null}pop.dataset.open="false"}
function placePop(){
  if(!popBtn)return;
  const r=popBtn.getBoundingClientRect(),pr=pop.getBoundingClientRect();
  let x=r.left,y=r.bottom+8;
  if(x+pr.width>innerWidth-16)x=Math.max(16,innerWidth-16-pr.width);
  if(y+pr.height>innerHeight-16)y=Math.max(16,r.top-8-pr.height);
  pop.style.left=x+"px";pop.style.top=y+"px";
}
function openPop(btn){
  pop.innerHTML=(btn.dataset.info||"").split(/\s+/).filter(Boolean)
    .map(k=>{const d=document.createElement("p");d.textContent=T(k);return d.outerHTML}).join("");
  pop.dataset.open="true";btn.setAttribute("aria-expanded","true");popBtn=btn;
  placePop();
}
document.addEventListener("click",e=>{
  const t=e.target,b=t&&t.closest?t.closest(".i"):null;
  if(b){e.stopPropagation();if(popBtn===b)closePop();else openPop(b);return}
  if(!t||!t.closest||!t.closest("#pop"))closePop();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
addEventListener("resize",placePop);
addEventListener("scroll",placePop,true);

function tech(){
  const c=CANDLES.map(r=>r[4]),h=CANDLES.map(r=>r[2]),l=CANDLES.map(r=>r[3]),N=c.length,px=c[N-1];
  const chip=(cl,t)=>`<span class="chip ${cl}">${t}</span>`;
  const na=`<td class="n">—</td><td>${chip("na",T("p_na"))}</td>`;
  const R=[];
  const rsi=RSI(c);R.push(["RSI (14)",rsi==null?null:rsi.toFixed(1),rsi==null?null:
    rsi>70?["up",tpl("p_over",{n:70})]:rsi<30?["down",tpl("p_under",{n:30})]:["mid",tpl("p_between",{a:30,b:70})],15]);
  const m=MACD(c);R.push(["MACD (12,26,9)",m==null?null:m.line.toFixed(4),m==null?null:
    (m.hist>=0?["up",T("p_above_sig")]:["down",T("p_below_sig")]),35]);
  const st=STOCH(h,l,c);R.push(["Stochastic %K (14,3)",st==null?null:st.k.toFixed(1),st==null?null:
    st.k>80?["up",tpl("p_over",{n:80})]:st.k<20?["down",tpl("p_under",{n:20})]:["mid",tpl("p_between",{a:20,b:80})],17]);
  const cci=CCI(h,l,c);R.push(["CCI (20)",cci==null?null:cci.toFixed(1),cci==null?null:
    cci>100?["up",tpl("p_over",{n:100})]:cci<-100?["down",tpl("p_under",{n:-100})]:["mid",tpl("p_between",{a:-100,b:100})],20]);
  const wr=WILLR(h,l,c);R.push(["Williams %R (14)",wr==null?null:wr.toFixed(1),wr==null?null:
    wr>-20?["up",tpl("p_over",{n:-20})]:wr<-80?["down",tpl("p_under",{n:-80})]:["mid",tpl("p_between",{a:-80,b:-20})],14]);
  const atr=ATR(h,l,c);R.push(["ATR (14)",atr==null?null:"฿"+atr.toFixed(4),atr==null?null:["mid",T("p_value")],15]);
  const bb=BB(c);R.push(["Bollinger (20, 2σ)",bb==null?null:"฿"+bb.up.toFixed(2)+" / ฿"+bb.low.toFixed(2),bb==null?null:
    px>bb.up?["up",T("p_above_band")]:px<bb.low?["down",T("p_below_band")]:["mid",T("p_in_band")],20]);
  [["SMA",SMA],["EMA",EMA]].forEach(([nm,fn])=>[10,20,50].forEach(n=>{const v=fn(c,n);
    R.push([`${nm} (${n})`,v==null?null:"฿"+v.toFixed(3),v==null?null:(px>v?["up",T("p_px_above")]:["down",T("p_px_below")]),n])}));
  let html=`<thead><tr><th>${T("th_ind")}</th><th class="n">${T("th_val")}</th><th>${T("th_pos")}</th><th class="n">${T("th_bars")}</th></tr></thead><tbody>`;
  R.forEach(([nm,val,pos,need])=>{html+=`<tr><td>${nm}</td>`+(val==null?na:`<td class="n">${val}</td><td>${chip(pos[0],pos[1])}</td>`)
    +`<td class="n" style="color:var(--text-muted)">${N} / ${need}</td></tr>`});
  $("#t-tech").innerHTML=html+"</tbody>";
}

function cSlip(){
  const W=880,H=290,Lx=54,R=24,Tp=14,B=42,s=mk("#c-slip",W,H);if(!s)return;
  const all=(D.slipNow||[]).map(r=>({side:r.side,size:+r.size_kub,slip:+r.slippage_pct,vwap:+r.vwap,lv:+r.levels_used}));
  const sizes=[...new Set(all.map(r=>r.size))].sort((a,b)=>a-b);if(!sizes.length)return;
  const maxY=Math.max(.5,Math.ceil(Math.max(...all.map(r=>r.slip))*4)/4);
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sizes.length-1),y=v=>H-B-(v/maxY)*(H-B-Tp);
  for(let g=0;g<=maxY+1e-9;g+=maxY/4){el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g.toFixed(2)+"%"}
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  sizes.forEach((sz,i)=>el("text",{class:"tick",x:x(i),y:H-B+18,"text-anchor":"middle"},s).textContent=sz>=1000?sz/1000+"k":sz);
  el("text",{class:"tick",x:(Lx+W-R)/2,y:H-B+34,"text-anchor":"middle"},s).textContent="KUB";
  [["SELL","var(--down)",T("lg_sell")],["BUY","var(--up)",T("lg_buy")]].forEach(([side,col,nm])=>{
    const rs=sizes.map(sz=>all.find(r=>r.side===side&&r.size===sz)).filter(Boolean);if(!rs.length)return;
    const pts=rs.map(r=>[x(sizes.indexOf(r.size)),y(r.slip)]);
    el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L "),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"},s);
    rs.forEach((r,i)=>{el("circle",{cx:pts[i][0],cy:pts[i][1],r:5,fill:col,stroke:"var(--bg)","stroke-width":2},s);
      hov(el("circle",{cx:pts[i][0],cy:pts[i][1],r:15,class:"hit"},s),
        `<b>${nm} ${fmt(r.size)} KUB</b><br><span class="k">cost</span> ${r.slip.toFixed(2)}%<br><span class="k">avg</span> ฿${r.vwap.toFixed(4)}<br><span class="k">levels</span> ${r.lv}`)})});
  const a=all.find(r=>r.side==="SELL"&&r.size===10000),b=all.find(r=>r.side==="BUY"&&r.size===10000);
  $("#slipnote").innerHTML=a&&b?`<b>10,000 KUB</b> — ${T("lg_sell")}: ${a.slip.toFixed(2)}% · ${T("lg_buy")}: ${b.slip.toFixed(2)}%`:"";

function exchange(){
  const ex=D.exchange||{},all=ex.flow||[];
  const days=(RANGES.find(r=>r[0]===EXRANGE)||[])[1]||7;
  const flow=all.slice(-days);
  const since=ex.collecting_since?Date.parse(ex.collecting_since):null;
  // A day the history walk has not reached is uncollected, not a quiet day.
  const uncovered=r=>r.covered===false||(r.covered==null&&since!=null&&Date.parse(r.day+"T23:59:59Z")<since);
  const net7=flow.filter(r=>!uncovered(r)).reduce((s,r)=>s+(+r.net||0),0);
  const k=(t,v,s)=>`<div class="kpi"><dt>${t}</dt><dd>${v}</dd><div class="sub">${s}</div></div>`;
  // Only the exchange's own wallets: its cold wallets plus the live hot one.
  const exCold=(D.treasury||[]).filter(t=>t.cat==="cex_cold");
  const exHot=(D.treasury||[]).filter(t=>t.cat==="cex_hot");
  const sumK=a=>a.reduce((s,r)=>s+r.kub,0);
  const bal=ex.balance!=null?ex.balance:sumK(exCold)+sumK(exHot);
  $("#exkpis").innerHTML=
     k(T("ex_bal"),fmt(bal)+" KUB",
       `${T("ex_cold")} <b>${fmt(sumK(exCold))}</b> (${exCold.length}) · ${T("ex_hot")} <b>${fmt(sumK(exHot))}</b> (${exHot.length})`)
    +k(T("ex_net"),(net7>=0?"+":"")+fmt(net7)+" KUB",tpl("ex_days",{n:flow.filter(r=>!uncovered(r)).length}));

  const W=880,H=240,Lx=62,R=16,Tp=18,B=40,s=mk("#c-exflow",W,H);if(!s)return;
  if(!flow.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const hi=Math.max(100,...flow.flatMap(r=>[+r.in||0,+r.out||0]));
  const mid=(H-B+Tp)/2,y=v=>mid-(v/hi)*(mid-Tp);
  const slot=(W-Lx-R)/flow.length;
  // Two bars per day while they still fit; below that, one slot-wide pair.
  const paired=slot>=8,bw=paired?Math.min(26,slot/2-2):Math.max(.8,slot*.42);
  const sparse=flow.length>14;
  [hi,hi/2,0,-hi/2,-hi].forEach(g=>{el("line",{class:g===0?"ax":"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=fmt(Math.abs(g))});
  flow.forEach((r,i)=>{
    const cx=Lx+slot*i+slot/2;
    const uncollected=since!=null&&Date.parse(r.day+"T23:59:59Z")<since;
    if(uncollected){
      el("rect",{x:cx-slot/2,y:Tp,width:Math.max(.8,slot),height:H-B-Tp,fill:"#14171f"},s);
      if(!sparse)el("text",{class:"tick",x:cx,y:mid+4,"text-anchor":"middle"},s).textContent=T("ex_nodata");
    }else{
      const i0=+r.in||0,o0=+r.out||0;
      const xi=paired?cx-bw-1:cx-bw/2,xo=paired?cx+1:cx-bw/2;
      el("rect",{x:xi,y:y(i0),width:bw,height:Math.max(1,mid-y(i0)),rx:paired?2:0,fill:"var(--up)"},s);
      el("rect",{x:xo,y:mid,width:bw,height:Math.max(1,mid-y(o0)),rx:paired?2:0,fill:"var(--down)",
        "fill-opacity":paired?1:.85},s);
    }
    hov(el("rect",{x:cx-slot/2,y:Tp,width:Math.max(3,slot),height:H-B-Tp,class:"hit"},s),
      uncollected?`<b>${dmy(r.day)}</b><br>${T("ex_nodata")}`
      :`<b>${dmy(r.day)}</b><br><span class="k">${T("ex_in")}</span> ${fmt(r.in)} (${r.in_tx})<br><span class="k">${T("ex_out")}</span> ${fmt(r.out)} (${r.out_tx})<br><span class="k">net</span> ${fmt(r.net)}`);
    if(!sparse)el("text",{class:"tick",x:cx,y:H-B+18,"text-anchor":"middle"},s).textContent=dmy(r.day);
  });
  if(sparse){
    el("text",{class:"tick",x:Lx,y:H-B+18},s).textContent=dmy(flow[0].day);
    el("text",{class:"tick",x:W-R,y:H-B+18,"text-anchor":"end"},s).textContent=dmy(flow[flow.length-1].day);
  }
}
// Two measured quantities divided by each other, rather than a fee total
// scaled by a gas price nobody actually paid.
function avgFee(r){
  if(r.fees==null||!r.tx)return "—";
  return fmt(r.fees/r.tx,6)+" KUB";
}
function chainRows(){
  const days=(RANGES.find(r=>r[0]===RANGE)||[])[1]||30;
  const all=(D.chain||[]).filter(r=>r.fees!=null||r.tx!=null);
  return all.slice(-days);
}
function cChain(){
  const W=880,H=260,Lx=62,R=58,Tp=18,B=38,s=mk("#c-chain",W,H);if(!s)return;
  const rs=chainRows();
  const note=$("#chainnote");
  if(!rs.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");
    if(note)note.textContent="";return}
  const fees=rs.map(r=>r.fees).filter(v=>v!=null);
  const txs=rs.map(r=>r.tx).filter(v=>v!=null);
  const fHi=Math.max(1,...fees)*1.15,tHi=Math.max(1,...txs)*1.15;
  const slot=(W-Lx-R)/rs.length,bw=Math.max(1,Math.min(22,slot-2));
  const y=v=>H-B-(v/fHi)*(H-B-Tp),y2=v=>H-B-(v/tHi)*(H-B-Tp);
  [0,fHi/2,fHi].forEach(g=>{el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=fmt(g,g<10?1:0)});
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  [0,tHi/2,tHi].forEach(g=>el("text",{class:"tick",x:W-R+9,y:y2(g)+3.5},s)
    .textContent=g>=1000?Math.round(g/1000)+"k":Math.round(g));
  rs.forEach((r,i)=>{
    const cx=Lx+slot*i;
    if(r.fees!=null)el("rect",{x:cx+(slot-bw)/2,y:y(r.fees),width:bw,height:Math.max(1,H-B-y(r.fees)),rx:2,
      fill:"var(--accent)","fill-opacity":.85},s);
  });
  let d="",open=false;
  rs.forEach((r,i)=>{const cx=Lx+slot*i+slot/2;
    if(r.tx==null){open=false;return}d+=(open?" L ":" M ")+cx+" "+y2(r.tx);open=true});
  if(d)el("path",{d:d.trim(),fill:"none",stroke:"var(--warn)","stroke-width":2,"stroke-linejoin":"round"},s);
  rs.forEach((r,i)=>{const cx=Lx+slot*i;
    hov(el("rect",{x:cx,y:Tp,width:slot,height:H-B-Tp,class:"hit"},s),
      `<b>${dmy(r.day)}</b><br><span class="k">${T("ch_fees")}</span> ${r.fees==null?"—":fmt(r.fees,2)}<br><span class="k">${T("ch_tx")}</span> ${r.tx==null?"—":fmt(r.tx)}<br><span class="k">${T("ch_avg")}</span> ${avgFee(r)}`)});
  el("text",{class:"tick",x:Lx,y:H-B+18},s).textContent=dmy(rs[0].day);
  el("text",{class:"tick",x:W-R,y:H-B+18,"text-anchor":"end"},s).textContent=dmy(rs[rs.length-1].day);
  const last=rs[rs.length-1];
  if(note)note.innerHTML=(last.fees!=null?`<b>${dmy(last.day)}</b> — ${T("ch_fees")}: ${fmt(last.fees,2)} KUB · ${T("ch_avg")}: ${avgFee(last)}<br>`:"")+T("n_chain");
}
function treasury(){
  const MAP={stake:"stake",fund:"fund",cex_cold:"cex",cex_hot:"cex",reserve:"reserve"};
  const tot={stake:0,fund:0,cex:0,reserve:0},cnt={stake:0,fund:0,cex:0,reserve:0};
  (D.treasury||[]).forEach(t=>{const g=MAP[t.cat];if(!g)return;tot[g]+=t.kub;cnt[g]++});
  const watched=tot.stake+tot.fund+tot.cex+tot.reserve;
  const others=(D.other||[]).filter(r=>!r.kkub);
  const kkub=(D.supply&&D.supply.kkub)||((D.other||[]).find(r=>r.kkub)||{}).kub||0;
  const reserve=others.filter(r=>r.cat==="reserve");
  const unid=others.filter(r=>r.cat!=="reserve");
  const sum=a=>a.reduce((s,r)=>s+r.kub,0);
  const total=(D.supply&&D.supply.total)||0;
  if(!watched)return;
  const grand=total||watched+kkub+sum(others);
  const rest=Math.max(0,grand-watched-kkub-sum(unid));

  const segs=[["stake",T("g_stake"),"var(--up)",tot.stake,cnt.stake],
              ["fund",T("g_fund"),"var(--accent)",tot.fund,cnt.fund],
              ["cex",T("g_cold"),"var(--warn)",tot.cex,cnt.cex],
              ["kkub",T("g_kkub"),"var(--alt)",kkub,1],
              ["reserve",T("g_reserve"),"#e07b39",tot.reserve+sum(reserve),cnt.reserve+reserve.length],
              ["unid",T("g_unid"),"#7f8694",sum(unid),unid.length],
              ["rest",T("g_rest"),"#3a3f4b",rest,null]].filter(g=>g[3]>0);

  $("#treaslegend").innerHTML=segs.map(g=>
    `<li><span class="sw box" style="background:${g[2]}"></span><span>${g[1]} · ${(g[3]/grand*100).toFixed(1)}%</span></li>`).join("");

  const W=880,H=92,Tp=18,s=mk("#c-treas",W,H);let X=0;
  segs.forEach(g=>{const w=g[3]/grand*(W-4);
    el("rect",{x:X,y:Tp,width:Math.max(0,w-2),height:40,rx:3,fill:g[2]},s);
    hov(el("rect",{x:X,y:Tp-6,width:Math.max(0,w-2),height:52,class:"hit"},s),
      `<b>${g[1]}</b><br>${fmt(g[3])} KUB${g[4]?" · "+g[4]:""}<br>${(g[3]/grand*100).toFixed(1)}%`);
    if(w>96)el("text",{class:"dlab",x:X+9,y:Tp+25,fill:g[0]==="rest"||g[0]==="unid"?"var(--text-primary)":"#0b0b0b"},s)
      .textContent=(g[3]/1e6).toFixed(2)+"M";
    X+=w});
  el("text",{class:"tick",x:0,y:Tp+56},s).textContent=
    tpl("t_supply",{watched:fmt(watched),total:fmt(grand),pct:(watched/grand*100).toFixed(1)});

  let h=`<thead><tr><th>${T("th_wallet")}</th><th>${T("th_group")}</th><th class="n">${T("th_bal")}</th><th class="n">${T("th_share")}</th></tr></thead><tbody>`;
  const row=(name,cat,kub)=>`<tr><td>${name}</td><td><span class="tag">${cat}</span></td>
    <td class="n">${fmt(kub)}</td><td class="n">${(kub/grand*100).toFixed(1)}%</td></tr>`;
  (D.treasury||[]).slice(0,6).forEach(t=>{h+=row(t.label||"—",t.cat,t.kub)});
  // An address kubscan carries no label for is shown as the address itself —
  // no placeholder text standing in for a name nobody has.
  (D.other||[]).slice(0,8).forEach(r=>{
    h+=row(r.label?r.label:`<span class="addr">${short(r.address)}</span>`,r.cat||"unidentified",r.kub)});
  $("#t-treas").innerHTML=h+"</tbody>";
}
function health(){
  const exp={"cex":288,"chain:cex_hot":288,"chain:cex_cold,fund,stake":24,"watch_balance":288,"whales":1,
             "alert:telegram":4,"dex_quotes":96,"supply":24,"chain_daily":24,"chain_fees":288};
  const rows=D.health||[];
  let okN=0;
  let h=`<thead><tr><th>${T("th_job")}</th><th class="n">${T("th_runs")}</th><th class="n">${T("th_fail")}</th><th>${T("th_state")}</th></tr></thead><tbody>`;
  rows.forEach(r=>{const e=exp[r.job],partial=e&&r.runs<e*.9;
    const cls=r.failed?"down":partial?"mid":"up",txt=r.failed?`${r.failed} ${T("st_fail")}`:partial?T("st_ramp"):T("st_ok");
    if(!r.failed&&!partial)okN++;
    h+=`<tr><td><span class="tag">${r.job}</span></td><td class="n">${r.runs}${e?` <span style="color:var(--text-muted)">/ ${e}</span>`:""}</td>
      <td class="n">${r.failed}</td><td><span class="chip ${cls}">${txt}</span></td></tr>`});
  $("#t-health").innerHTML=h+"</tbody>";
  $("#healthsum").textContent=tpl("health_sum",{ok:okN,n:rows.length});
  const body=$("#healthbody"),btn=$("#healthfold");
  btn.textContent=body.hidden?T("fold_show"):T("fold_hide");
  btn.setAttribute("aria-expanded",String(!body.hidden));
}

function render(){
  paintStatic();tfButtons();subButtons();applySubs();rangeButtons();exRangeButtons();
  kpis();tech();cSlip();cSlipT();cTaker();cSweep();
  dexSelect();tDex();exchange();cChain();treasury();health();
}
function setTF(tf){
  TF=tf;try{localStorage.setItem("kfd-tf",tf)}catch(e){}
  document.querySelectorAll("#tfseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===tf)));
  $("#techtf").textContent=tf;
  mountTV();
  if(!LIVE){render();return}
  fetch(`/api/candles?tf=${tf}&limit=300`).then(r=>r.json())
    .then(j=>{CANDLES=(j.candles||[]).map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);render()})
    .catch(()=>render());
}
document.querySelectorAll(".seg button[data-lang]").forEach(b=>
  b.addEventListener("click",()=>{L=b.dataset.lang;try{localStorage.setItem("kfd-lang",L)}catch(e){}render();mountTV()}));
$("#dexsize").addEventListener("change",e=>{DEXSIZE=+e.target.value;tDex()});
$("#healthfold").addEventListener("click",()=>{
  const body=$("#healthbody");body.hidden=!body.hidden;
  $("#healthfold").textContent=body.hidden?T("fold_show"):T("fold_hide");
  $("#healthfold").setAttribute("aria-expanded",String(!body.hidden));
  try{localStorage.setItem("kfd-health",body.hidden?"0":"1")}catch(e){}
});
try{
  const sv=localStorage.getItem("kfd-lang");
  if(sv&&I18N[sv])L=sv;
  else if((navigator.language||"").startsWith("th"))L="th";
  else if((navigator.language||"").startsWith("zh"))L="zh";
  const st=localStorage.getItem("kfd-tf");if(st&&TFS.some(t=>t[0]===st))TF=st;
  const sr=localStorage.getItem("kfd-range");if(sr&&RANGES.some(r=>r[0]===sr))RANGE=sr;
  const se=localStorage.getItem("kfd-exrange");if(se&&RANGES.some(r=>r[0]===se))EXRANGE=se;
  const ss=localStorage.getItem("kfd-subs");
  if(ss){const o=JSON.parse(ss);SUBS.forEach(k=>{if(typeof o[k]==="boolean")SUBON[k]=o[k]})}
  if(localStorage.getItem("kfd-health")==="1")$("#healthbody").hidden=false;
}catch(e){}

render();mountTV();
fetch("/api/data").then(r=>r.json()).then(j=>{
  if(!j)return;
  if(j.now){D=j;LIVE=true;DEXSIZE=null;
    if(j.candles&&j.candles.candles){CANDLES=j.candles.candles.map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]])}
    if(TF!==(j.candles&&j.candles.tf))setTF(TF);else render();
  }else if(j.error){D=SNAP;LIVE=false;D.errors=[j.error];render();
    $("#banner").hidden=false;$("#banner").textContent=T("apierr")+j.error}
}).catch(()=>{});
</script>
