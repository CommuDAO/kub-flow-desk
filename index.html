<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KUB Flow Desk</title>
<meta name="description" content="KUB market microstructure, execution cost, five-DEX quotes and treasury balances.">
<meta name="color-scheme" content="dark">
<style>
/* TradingView design tokens — deliberately single-theme dark, to match the
   embedded chart. Every colour is painted explicitly; nothing inherits. */
:root{
  color-scheme:dark;
  --surface-base:#000000;
  --surface-raised:#1f1f1f;
  --surface-muted:#2e2e2e;
  --text-primary:#dbdbdb;
  --text-secondary:#9e9eff;
  --text-tertiary:#ffffff;
  --text-inverse:#575757;
  --up:#26a69a; --down:#ef5350; --accent:#2962ff;
  --s1:1px; --s2:2px; --s3:4px; --s4:5px; --s5:6px; --s6:7px; --s7:8px; --s8:11px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-2xl:24px;
  --sh1:rgba(0,0,0,.4) 0 2px 4px 0;
  --dur:300ms;
  --sans:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-base)}
body{color:var(--text-primary);font-family:var(--sans);font-size:14px;line-height:18px;font-weight:400;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 48px;padding-left:16px;padding-right:16px}
:focus-visible{outline:2px solid var(--text-secondary);outline-offset:2px;border-radius:var(--r-xs)}

.mast{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s7) var(--s8);padding:var(--s8) 0}
.brand{display:flex;align-items:center;gap:var(--s7)}
.dot{width:20px;height:20px;border-radius:var(--r-sm);background:var(--up);flex:none}
.mast h1{margin:0;font-size:20px;line-height:26px;font-weight:600;color:var(--text-tertiary);letter-spacing:-.01em}
.mast .pair{font-family:var(--mono);font-size:12px;color:var(--text-inverse);
  padding:var(--s2) var(--s7);border:1px solid var(--surface-muted);border-radius:var(--r-2xl)}
.tools{margin-left:auto;display:flex;align-items:center;gap:var(--s7);flex-wrap:wrap}
.seg{display:flex;background:var(--surface-raised);border:1px solid var(--surface-muted);
  border-radius:var(--r-md);padding:var(--s2);gap:var(--s2)}
.seg button{font:500 12px/16px var(--sans);padding:var(--s4) var(--s8);background:transparent;
  color:var(--text-inverse);border:0;border-radius:var(--r-sm);cursor:pointer;
  transition:background var(--dur),color var(--dur)}
.seg button:hover{background:var(--surface-muted);color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--surface-muted);color:var(--text-tertiary)}
.stamp{font-family:var(--mono);font-size:12px;color:var(--text-inverse)}
.srcline{font-size:12px;line-height:18px;color:var(--text-inverse);padding-bottom:var(--s8)}
.banner{background:var(--surface-raised);border:1px solid var(--surface-muted);border-left:3px solid var(--down);
  border-radius:var(--r-md);padding:var(--s7) var(--s8);font-size:13px;color:var(--text-primary);margin-bottom:var(--s8)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s7);margin-bottom:var(--s8)}
.kpi{background:var(--surface-raised);border:1px solid var(--surface-muted);border-radius:var(--r-md);
  padding:var(--s8) var(--s8) 10px;box-shadow:var(--sh1)}
.kpi dt{margin:0;font-size:12px;line-height:16px;color:var(--text-inverse);font-weight:400}
.kpi dd{margin:var(--s5) 0 0;font-family:var(--mono);font-size:20px;line-height:24px;font-weight:600;
  color:var(--text-tertiary);letter-spacing:-.01em}
.kpi .sub{font-size:12px;line-height:16px;color:var(--text-inverse);margin-top:var(--s3)}

.card{background:var(--surface-raised);border:1px solid var(--surface-muted);border-radius:var(--r-lg);
  padding:var(--s8) var(--s8) 10px;margin-bottom:var(--s8);box-shadow:var(--sh1)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s5) var(--s8);margin-bottom:var(--s5)}
.ch h2{margin:0;font-size:16px;line-height:22px;font-weight:600;color:var(--text-tertiary)}
.ch .when{font-size:12px;color:var(--text-inverse);margin-left:auto}
.lede{margin:0 0 var(--s8);font-size:13px;line-height:19px;color:var(--text-primary);max-width:68ch}
.legend{display:flex;flex-wrap:wrap;gap:var(--s4) var(--s8);margin:0 0 10px;padding:0;list-style:none;
  font-size:12px;color:var(--text-primary)}
.legend li{display:flex;align-items:center;gap:var(--s5)}
.sw{width:18px;height:3px;border-radius:var(--s2);flex:none}
.sw.dot{width:9px;height:9px;border-radius:50%}

#tvwrap{height:min(64vh,540px);min-height:340px;border-radius:var(--r-md);overflow:hidden;background:var(--surface-base)}
#tv-chart{height:100%;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--surface-muted);stroke-width:1}
.ax{stroke:var(--text-inverse);stroke-width:1}
.tick{font-family:var(--mono);font-size:10.5px;fill:var(--text-inverse)}
.dlab{font-family:var(--mono);font-size:11px;font-weight:600}
.hit{fill:transparent;cursor:crosshair}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
th{text-align:left;font-size:12px;font-weight:400;color:var(--text-inverse);
  padding:0 var(--s8) var(--s7) 0;border-bottom:1px solid var(--surface-muted);white-space:nowrap}
td{padding:var(--s7) var(--s8) var(--s7) 0;border-bottom:1px solid var(--surface-muted);
  vertical-align:baseline;color:var(--text-primary)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-right:0}
tr:last-child td{border-bottom:0}
tr.noquote td{color:var(--text-inverse)}
.chip{display:inline-flex;align-items:center;gap:var(--s3);font-size:12px;line-height:16px;
  padding:var(--s2) var(--s7);border-radius:var(--r-2xl);border:1px solid var(--surface-muted);color:var(--text-primary)}
.chip.up{color:var(--up)}.chip.down{color:var(--down)}.chip.mid{color:var(--text-inverse)}
.chip.na{color:var(--text-inverse)}
.best{background:var(--up);color:#00110f;font-size:11px;font-weight:600;padding:var(--s1) var(--s5);border-radius:var(--r-xs)}
.tag{font-family:var(--mono);font-size:11px;padding:var(--s1) var(--s5);border-radius:var(--r-xs);
  background:var(--surface-muted);color:var(--text-primary)}
.note{font-size:12.5px;line-height:18px;color:var(--text-inverse);margin:var(--s8) 0 0;
  padding-top:var(--s8);border-top:1px solid var(--surface-muted)}
.note b{font-weight:600;color:var(--text-primary)}
#tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity 150ms;
  background:var(--surface-muted);border:1px solid var(--text-inverse);border-radius:var(--r-sm);
  padding:var(--s7) var(--s8);font-family:var(--mono);font-size:11.5px;line-height:16px;
  color:var(--text-tertiary);box-shadow:var(--sh1);max-width:250px}
#tip .k{color:var(--text-inverse)}
footer{margin-top:var(--s8);padding-top:var(--s8);border-top:1px solid var(--surface-muted);
  font-size:12.5px;line-height:18px;color:var(--text-inverse)}
footer p{margin:0 0 var(--s7);max-width:76ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><span class="dot" aria-hidden="true"></span><h1 data-i18n="title">KUB Flow Desk</h1></div>
    <span class="pair">KUB_THB · BITKUB</span>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
      <span class="stamp" id="stamp"></span>
    </div>
  </header>
  <div class="srcline" data-i18n="src"></div>
  <div class="banner" id="banner" hidden></div>
  <dl class="kpis" id="kpis"></dl>

  <section class="card">
    <div class="ch">
      <h2 data-i18n="h_chart"></h2>
      <div class="seg" id="tfseg" role="group" aria-label="Timeframe"></div>
    </div>
    <div id="tvwrap"><div id="tv-chart"></div></div>
    <p class="note" data-i18n="n_tv"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_tech"></h2><span class="when" id="techwhen"></span></div>
    <p class="lede" data-i18n="l_tech"></p>
    <div class="tw"><table id="t-tech"></table></div>
    <p class="note" id="technote"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_cost"></h2><span class="when" data-i18n="w_now"></span></div>
    <p class="lede" data-i18n="l_cost"></p>
    <ul class="legend">
      <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell"></span></li>
      <li><span class="sw" style="background:var(--up)"></span><span data-i18n="lg_buy"></span></li>
    </ul>
    <div id="c-slip"></div>
    <p class="note" id="slipnote"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_dex"></h2><span class="when">KKUB → KUSDT</span></div>
    <p class="lede" data-i18n="l_dex"></p>
    <div class="tw"><table id="t-dex"></table></div>
    <p class="note" data-i18n="n_dex"></p>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_slipt"></h2><span class="when" data-i18n="w_hourly"></span></div>
    <p class="lede" data-i18n="l_slipt"></p>
    <ul class="legend">
      <li><span class="sw" style="background:var(--down)"></span><span data-i18n="lg_sell10"></span></li>
      <li><span class="sw" style="background:var(--up)"></span><span data-i18n="lg_buy10"></span></li>
    </ul>
    <div id="c-slipt"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_taker"></h2><span class="when" data-i18n="w_exec"></span></div>
    <p class="lede" data-i18n="l_taker"></p>
    <ul class="legend">
      <li><span class="sw dot" style="background:var(--up)"></span><span data-i18n="lg_bcross"></span></li>
      <li><span class="sw dot" style="background:var(--down)"></span><span data-i18n="lg_scross"></span></li>
    </ul>
    <div id="c-taker"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_sweep"></h2><span class="when" data-i18n="w_sweep"></span></div>
    <p class="lede" data-i18n="l_sweep"></p>
    <div id="c-sweep"></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_treas"></h2><span class="when" data-i18n="w_treas"></span></div>
    <p class="lede" data-i18n="l_treas"></p>
    <div id="c-treas"></div>
    <div class="tw" style="margin-top:12px"><table id="t-treas"></table></div>
  </section>

  <section class="card">
    <div class="ch"><h2 data-i18n="h_health"></h2><span class="when" data-i18n="w_log"></span></div>
    <p class="lede" data-i18n="l_health"></p>
    <div class="tw"><table id="t-health"></table></div>
  </section>

  <footer>
    <p data-i18n="f1"></p>
    <p data-i18n="f2"></p>
    <p style="margin-top:10px" data-i18n="f3"></p>
  </footer>
</div>
<div id="tip" role="status" aria-live="polite"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

const SMA=(a,n)=>a.length<n?null:a.slice(-n).reduce((s,v)=>s+v,0)/n;
function EMAs(a,n){if(a.length<n)return[];const k=2/(n+1);let e=a.slice(0,n).reduce((s,v)=>s+v,0)/n;const o=[e];
  for(let i=n;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
const EMA=(a,n)=>{const s=EMAs(a,n);return s.length?s[s.length-1]:null};
function RSI(c,n=14){if(c.length<n+1)return null;let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+(d>0?d:0))/n;l=(l*(n-1)+(d<0?-d:0))/n}
  return l===0?100:100-100/(1+g/l)}
function MACD(c){if(c.length<35)return null;const ef=EMAs(c,12),es=EMAs(c,26),off=ef.length-es.length;
  const line=es.map((v,i)=>ef[i+off]-v);if(line.length<9)return null;
  const sg=EMAs(line,9),L1=line[line.length-1],S1=sg[sg.length-1];return{line:L1,signal:S1,hist:L1-S1}}
function STOCH(h,l,c,n=14,d=3){if(c.length<n+d)return null;const ks=[];
  for(let i=n-1;i<c.length;i++){const hh=Math.max(...h.slice(i-n+1,i+1)),ll=Math.min(...l.slice(i-n+1,i+1));
    ks.push(hh===ll?50:(c[i]-ll)/(hh-ll)*100)}return{k:ks[ks.length-1],d:SMA(ks,d)}}
function CCI(h,l,c,n=20){if(c.length<n)return null;const tp=c.map((v,i)=>(h[i]+l[i]+v)/3);
  const m=SMA(tp,n),w=tp.slice(-n),md=w.reduce((s,v)=>s+Math.abs(v-m),0)/n;
  return md===0?0:(tp[tp.length-1]-m)/(.015*md)}
function WILLR(h,l,c,n=14){if(c.length<n)return null;const hh=Math.max(...h.slice(-n)),ll=Math.min(...l.slice(-n));
  return hh===ll?-50:(hh-c[c.length-1])/(hh-ll)*-100}
function ATR(h,l,c,n=14){if(c.length<n+1)return null;const tr=[];
  for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  let a=tr.slice(0,n).reduce((s,v)=>s+v,0)/n;for(let i=n;i<tr.length;i++)a=(a*(n-1)+tr[i])/n;return a}
function BB(c,n=20,k=2){if(c.length<n)return null;const m=SMA(c,n),w=c.slice(-n);
  const sd=Math.sqrt(w.reduce((s,v)=>s+(v-m)*(v-m),0)/n);return{mid:m,up:m+k*sd,low:m-k*sd}}

    px>bb.up?["up",T("p_above_band")]:px<bb.low?["down",T("p_below_band")]:["mid",T("p_in_band")],20]);
  [["SMA",SMA],["EMA",EMA]].forEach(([nm,fn])=>[10,20,50].forEach(n=>{const v=fn(c,n);
    R.push([`${nm} (${n})`,v==null?null:"฿"+v.toFixed(3),v==null?null:(px>v?["up",T("p_px_above")]:["down",T("p_px_below")]),n])}));
  let html=`<thead><tr><th>${T("th_ind")}</th><th class="n">${T("th_val")}</th><th>${T("th_pos")}</th><th class="n">${T("th_bars")}</th></tr></thead><tbody>`;
  R.forEach(([nm,val,pos,need])=>{html+=`<tr><td>${nm}</td>`+(val==null?na:`<td class="n">${val}</td><td>${chip(pos[0],pos[1])}</td>`)
    +`<td class="n" style="color:var(--text-inverse)">${N} / ${need}</td></tr>`});
  $("#t-tech").innerHTML=html+"</tbody>";
}
function hourly(){if(!LIVE)return[];
  return (D.hourly||[]).map(r=>[bkk(r.hour),r.px_close==null?null:+r.px_close,r.trade_kub==null?null:+r.trade_kub,
    r.taker_buy_pct==null?null:+r.taker_buy_pct,r.slip_sell_10k==null?null:+r.slip_sell_10k,r.slip_buy_10k==null?null:+r.slip_buy_10k])}
function cSlip(){
  const W=880,H=290,Lx=54,R=108,Tp=14,B=42,s=mk("#c-slip",W,H);if(!s)return;
  const all=(D.slipNow||[]).map(r=>({side:r.side,size:+r.size_kub,slip:+r.slippage_pct,vwap:+r.vwap,lv:+r.levels_used}));
  const sizes=[...new Set(all.map(r=>r.size))].sort((a,b)=>a-b);if(!sizes.length)return;
  const maxY=Math.max(.5,Math.ceil(Math.max(...all.map(r=>r.slip))*4)/4);
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sizes.length-1),y=v=>H-B-(v/maxY)*(H-B-Tp);
  for(let g=0;g<=maxY+1e-9;g+=maxY/4){el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g.toFixed(2)+"%"}
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  sizes.forEach((sz,i)=>el("text",{class:"tick",x:x(i),y:H-B+18,"text-anchor":"middle"},s).textContent=sz>=1000?sz/1000+"k":sz);
  el("text",{class:"tick",x:(Lx+W-R)/2,y:H-B+34,"text-anchor":"middle"},s).textContent="KUB";
  [["SELL","var(--down)",T("lg_sell")],["BUY","var(--up)",T("lg_buy")]].forEach(([side,col,nm])=>{
    const rs=sizes.map(sz=>all.find(r=>r.side===side&&r.size===sz)).filter(Boolean);if(!rs.length)return;
    const pts=rs.map(r=>[x(sizes.indexOf(r.size)),y(r.slip)]);
    el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L "),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"},s);
    rs.forEach((r,i)=>{el("circle",{cx:pts[i][0],cy:pts[i][1],r:5,fill:col,stroke:"var(--surface-raised)","stroke-width":2},s);
      hov(el("circle",{cx:pts[i][0],cy:pts[i][1],r:15,class:"hit"},s),
        `<b>${nm} ${fmt(r.size)} KUB</b><br><span class="k">cost</span> ${r.slip.toFixed(2)}%<br><span class="k">avg</span> ฿${r.vwap.toFixed(4)}<br><span class="k">levels</span> ${r.lv}`)});
    const p=pts[pts.length-1];
    el("text",{class:"dlab",x:p[0]+11,y:p[1]+4,fill:col},s).textContent=`${nm} · ${rs[rs.length-1].slip.toFixed(2)}%`});
  const a=all.find(r=>r.side==="SELL"&&r.size===10000),b=all.find(r=>r.side==="BUY"&&r.size===10000);
  $("#slipnote").innerHTML=a&&b?`<b>10,000 KUB</b> — ${T("lg_sell")}: ${a.slip.toFixed(2)}% · ${T("lg_buy")}: ${b.slip.toFixed(2)}%`:"";
}
function cSlipT(){
  const W=880,H=210,Lx=50,R=14,Tp=12,B=32,s=mk("#c-slipt",W,H);if(!s)return;
  const rs=hourly().map((r,i)=>({i,t:r[0],a:r[4],b:r[5]})),has=rs.filter(r=>r.a!=null||r.b!=null);
  if(!has.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const hi=Math.max(.5,...has.flatMap(r=>[r.a||0,r.b||0]))*1.2;
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,rs.length-1),y=v=>H-B-(v/hi)*(H-B-Tp);
  [0,hi/2,hi].forEach(g=>{el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-8,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g.toFixed(2)+"%"});
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  [["a","var(--down)"],["b","var(--up)"]].forEach(([k,col])=>{let d="",open=false;
    rs.forEach(r=>{if(r[k]==null){open=false;return}d+=(open?" L ":" M ")+x(r.i)+" "+y(r[k]);open=true});
    if(d)el("path",{d:d.trim(),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"},s)});
  rs.forEach(r=>{if(r.a==null&&r.b==null)return;
    hov(el("rect",{x:x(r.i)-7,y:Tp,width:14,height:H-B-Tp,class:"hit"},s),
      `<b>${r.t}</b><br><span class="k">${T("lg_sell10")}</span> ${r.a==null?"—":r.a.toFixed(2)+"%"}<br><span class="k">${T("lg_buy10")}</span> ${r.b==null?"—":r.b.toFixed(2)+"%"}`)});
  el("text",{class:"tick",x:Lx,y:H-B+16},s).textContent=rs[0].t;
  el("text",{class:"tick",x:W-R,y:H-B+16,"text-anchor":"end"},s).textContent=rs[rs.length-1].t;
}
function cTaker(){
  const W=880,H=230,Lx=46,R=14,Tp=16,B=34,s=mk("#c-taker",W,H);if(!s)return;
  const rs=hourly().map((r,i)=>({i,t:r[0],v:r[3]}));
  if(!rs.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const mid=(H-B+Tp)/2,y=v=>mid-((v-50)/50)*(mid-Tp),bw=(W-Lx-R)/rs.length-3;
  [0,25,50,75,100].forEach(g=>{el("line",{class:g===50?"ax":"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g+"%"});
  rs.forEach(r=>{const X=Lx+r.i*(W-Lx-R)/rs.length+1.5;
    if(r.v!=null){const up=r.v>=50;
      el("rect",{x:X,y:up?y(r.v):y(50),width:Math.max(1,bw),height:Math.max(1.5,Math.abs(y(r.v)-y(50))),rx:2,
        fill:up?"var(--up)":"var(--down)"},s)}
    hov(el("rect",{x:X-1.5,y:Tp,width:bw+3,height:H-B-Tp,class:"hit"},s),`<b>${r.t}</b><br>${r.v==null?"—":r.v.toFixed(1)+"%"}`)});
  el("text",{class:"tick",x:Lx,y:H-B+16},s).textContent=rs[0].t;
  el("text",{class:"tick",x:W-R,y:H-B+16,"text-anchor":"end"},s).textContent=rs[rs.length-1].t;
}
function cSweep(){
  const W=880,H=250,Lx=54,R=70,Tp=18,B=32,s=mk("#c-sweep",W,H);if(!s)return;
  const sw=(D.sweeps||[]).map(r=>[bkk(r.ts),r.side,Math.round(+r.total_kub),r.levels]);
  if(!sw.length){el("text",{class:"tick",x:W/2,y:H/2,"text-anchor":"middle"},s).textContent=T("loading");return}
  const lo=Math.log10(180),hi=Math.log10(Math.max(40000,...sw.map(r=>r[2])));
  const x=i=>Lx+i*(W-Lx-R)/Math.max(1,sw.length-1),y=v=>H-B-((Math.log10(v)-lo)/(hi-lo))*(H-B-Tp);
  [200,1000,5000,30000].forEach(g=>{el("line",{class:"gl",x1:Lx,x2:W-R,y1:y(g),y2:y(g)},s);
    el("text",{class:"tick",x:Lx-9,y:y(g)+3.5,"text-anchor":"end"},s).textContent=g>=1000?g/1000+"k":g});
  el("line",{class:"ax",x1:Lx,x2:W-R,y1:H-B,y2:H-B},s);
  let big=0,bi=0;sw.forEach((r,i)=>{if(r[2]>big){big=r[2];bi=i}});
  sw.forEach((r,i)=>{const col=r[1]==="BUY"?"var(--up)":"var(--down)";
    el("circle",{cx:x(i),cy:y(r[2]),r:5.5,fill:col,stroke:"var(--surface-raised)","stroke-width":2},s);
    hov(el("circle",{cx:x(i),cy:y(r[2]),r:14,class:"hit"},s),
      `<b>${r[1]} ${fmt(r[2])} KUB</b><br><span class="k">at</span> ${r[0]}<br><span class="k">levels</span> ${r[3]}`)});
  el("text",{class:"dlab",x:Math.min(x(bi)+12,W-R-4),y:y(big)+4,fill:sw[bi][1]==="BUY"?"var(--up)":"var(--down)"},s)
    .textContent=fmt(big)+" KUB";
}
function tDex(){
  const d=D.dex||[],sizes=[...new Set(d.map(r=>+r.size_kub))].sort((a,b)=>a-b);
  let h=`<thead><tr><th>${T("th_size")}</th><th>${T("th_dex")}</th><th class="n">${T("th_out")}</th><th class="n">${T("th_px")}</th><th class="n">${T("th_vs")}</th></tr></thead><tbody>`;
  sizes.forEach(sz=>{d.filter(r=>+r.size_kub===sz).forEach((r,i)=>{
    const q=r.quoted!==false&&r.usdt_out!=null;
    h+=`<tr class="${q?"":"noquote"}"><td>${i===0?fmt(sz)+" KUB":""}</td>
      <td>${r.dex}${r.is_best?' <span class="best">BEST</span>':""}${r.fee?` <span class="tag">${r.fee}</span>`:""}</td>`
      +(q?`<td class="n">${fmt(r.usdt_out,4)}</td><td class="n">${fmt(r.px_usdt,6)}</td>
           <td class="n" style="color:${+r.vs_best_pct<-1?"var(--down)":"var(--text-primary)"}">${(+r.vs_best_pct).toFixed(2)}%</td>`
         :`<td class="n" colspan="3" style="text-align:right">${T("no_quote")}</td>`)
      +`</tr>`})});
  $("#t-dex").innerHTML=h+"</tbody>";
}
function treasury(){
  const cats=[["stake",T("g_stake"),"var(--up)"],["fund",T("g_fund"),"var(--accent)"],["cex_cold",T("g_cold"),"var(--text-inverse)"]];
  const tot={stake:0,fund:0,cex_cold:0},cnt={stake:0,fund:0,cex_cold:0};
  (D.treasury||[]).forEach(t=>{if(tot[t.cat]==null)return;tot[t.cat]+=t.kub;cnt[t.cat]++});
  const grand=tot.stake+tot.fund+tot.cex_cold;if(!grand)return;
  const W=880,H=96,Tp=24,s=mk("#c-treas",W,H);let X=0;
  cats.forEach(([k,nm,col])=>{const w=tot[k]/grand*(W-4);
    el("rect",{x:X,y:Tp,width:Math.max(0,w-3),height:38,rx:4,fill:col},s);
    hov(el("rect",{x:X,y:Tp-6,width:Math.max(0,w-3),height:50,class:"hit"},s),
      `<b>${nm}</b><br>${fmt(tot[k])} KUB · ${cnt[k]} · ${(tot[k]/grand*100).toFixed(1)}%`);
    if(w>170){el("text",{class:"dlab",x:X+11,y:Tp+23,fill:"#000000"},s).textContent=(tot[k]/1e6).toFixed(1)+"M";
      el("text",{class:"tick",x:X,y:Tp-9},s).textContent=nm}
    X+=w});
  el("text",{class:"tick",x:0,y:Tp+54},s).textContent=fmt(grand)+" "+T("t_watched");
  let h=`<thead><tr><th>${T("th_wallet")}</th><th>${T("th_group")}</th><th class="n">${T("th_bal")}</th><th class="n">${T("th_share")}</th></tr></thead><tbody>`;
  (D.treasury||[]).slice(0,8).forEach(t=>{h+=`<tr><td>${t.label||"—"}</td><td><span class="tag">${t.cat}</span></td>
    <td class="n">${fmt(t.kub)}</td><td class="n">${(t.kub/grand*100).toFixed(1)}%</td></tr>`});
  $("#t-treas").innerHTML=h+"</tbody>";
}
function health(){
  const exp={"cex":288,"chain:cex_hot":288,"chain:cex_cold,fund,stake":24,"watch_balance":288,"whales":1,"alert:telegram":4,"dex_quotes":96};
  let h=`<thead><tr><th>${T("th_job")}</th><th class="n">${T("th_runs")}</th><th class="n">${T("th_fail")}</th><th>${T("th_state")}</th></tr></thead><tbody>`;
  (D.health||[]).forEach(r=>{const e=exp[r.job],partial=e&&r.runs<e*.9;
    const cls=r.failed?"down":partial?"mid":"up",txt=r.failed?`${r.failed} ${T("st_fail")}`:partial?T("st_ramp"):T("st_ok");
    h+=`<tr><td><span class="tag">${r.job}</span></td><td class="n">${r.runs}${e?` <span style="color:var(--text-inverse)">/ ${e}</span>`:""}</td>
      <td class="n">${r.failed}</td><td><span class="chip ${cls}">${txt}</span></td></tr>`});
  $("#t-health").innerHTML=h+"</tbody>";
}

function render(){paintStatic();tfButtons();kpis();tech();cSlip();tDex();cSlipT();cTaker();cSweep();treasury();health()}
function setTF(tf){
  TF=tf;try{localStorage.setItem("kfd-tf",tf)}catch(e){}
  document.querySelectorAll("#tfseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tf===tf)));
  mountTV();
  if(!LIVE){render();return}
  fetch(`/api/candles?tf=${tf}&limit=300`).then(r=>r.json())
    .then(j=>{CANDLES=(j.candles||[]).map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);CBARS=j.bars||0;render()})
    .catch(()=>render());
}
document.querySelectorAll(".seg button[data-lang]").forEach(b=>
  b.addEventListener("click",()=>{L=b.dataset.lang;try{localStorage.setItem("kfd-lang",L)}catch(e){}render();mountTV()}));
try{
  const sv=localStorage.getItem("kfd-lang");
  if(sv&&I18N[sv])L=sv;
  else if((navigator.language||"").startsWith("th"))L="th";
  else if((navigator.language||"").startsWith("zh"))L="zh";
  const st=localStorage.getItem("kfd-tf");if(st&&TFS.some(t=>t[0]===st))TF=st;
}catch(e){}

render();mountTV();
fetch("/api/data").then(r=>r.json()).then(j=>{
  if(!j)return;
  if(j.now){D=j;LIVE=true;
    if(j.candles&&j.candles.candles){CANDLES=j.candles.candles.map(c=>[c[0],+c[1],+c[2],+c[3],+c[4],+c[5],c[6]]);CBARS=j.candles.bars}
    if(TF!==(j.candles&&j.candles.tf))setTF(TF);else render();
  }else if(j.error){D=SNAP;LIVE=false;D.errors=[j.error];render();
    $("#banner").hidden=false;$("#banner").textContent=T("apierr")+j.error}
}).catch(()=>{});
</script>
